<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>SNIPER v40 — PERFECT</title>
<style>
:root{--bg:#02060a;--panel:#08111a;--line:#143245;--cyan:#33d6ff;--red:#ff4d4d;--green:#3ddc84;--gold:#ffcc00;--text:#dff6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.shell{padding:10px;max-width:900px;margin:0 auto;display:grid;gap:10px}
.topbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
h1{margin:0;font-size:13px;color:var(--gold);letter-spacing:.5px}
.sub{font-size:10px;color:#7aa7bc;line-height:1.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,button{width:100%;background:#0a1a27;color:var(--cyan);border:1px solid #1c5a75;border-radius:10px;padding:12px;font-size:12px;outline:none}
button{font-weight:800;cursor:pointer;min-height:44px}
.live{font-size:11px;padding:8px 10px;border-radius:8px;background:#040b12;border:1px solid var(--line);display:flex;justify-content:space-between}
.progress{height:4px;background:#0a1a27;border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0%;transition:.3s}
.log{font-size:9px;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow:auto;background:#040b12;border:1px solid var(--line);border-radius:10px;padding:10px}
.charts-wall{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:700px){.charts-wall{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.card.setup{border-color:var(--gold);box-shadow:0 0 20px rgba(255,204,0,.25)}
.card.bos{border-color:var(--cyan);box-shadow:0 0 12px rgba(51,214,255,.2)}
.card-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800}
.badge{padding:3px 8px;border-radius:6px;font-size:9px;border:1px solid var(--line)}
.badge-gold{color:var(--gold);border-color:var(--gold);background:rgba(255,204,0,.15)}
.badge-cyan{color:var(--cyan);border-color:var(--cyan);background:rgba(51,214,255,.12)}
.spark{height:140px;background:#040b12;border:1px solid var(--line);border-radius:8px;overflow:hidden}.spark svg{width:100%;height:100%;display:block}
.banner{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:10px;font-weight:700;min-height:44px;display:grid;place-items:center}
.banner.gold{color:var(--gold);border-color:var(--gold);background:rgba(255,204,0,.1)}
.banner.cyan{color:var(--cyan);border-color:var(--cyan);background:rgba(51,214,255,.08)}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;font-size:9px}.lv{border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;font-weight:800;background:#040b12}
.btn-trade{background:#201a00;border:2px solid var(--gold);color:var(--gold)}
.btn-auto-on{background:#002a12!important;border-color:var(--green)!important;color:var(--green)!important;box-shadow:0 0 16px rgba(61,220,132,.5)}
.result{border:2px solid var(--gold);border-radius:10px;padding:12px;background:#0a0a05;font-size:11px;line-height:1.5;display:none}
</style></head><body>
<div class="shell">
<div class="topbar">
<h1>SNIPER v40 — PERFECT RUN • H1 DIR → M15 BOS → RETEST • TP 75%</h1>
<div class="sub">H1 EMA20>EMA50 = trend • M15 BOS >0.04% = break • FVG >0.15 ATR = gap • Entry = FVG 50% retest • SL = 2.5x wide • TP = Entry ±0.75% = 75% profit @ x100 • Auto trades on retest touch</div>
<div class="live"><span id="liveUsdLine">LIVE: idle — press TEST</span><b id="livePct">0%</b></div>
<div class="progress"><i id="progBar"></i></div>
<input type="text" id="apiTokenInput" placeholder="pat_... paste here (saved locally)">
<div class="row"><select id="accountSelect"><option value="">1) Press TEST</option></select><button onclick="doTest()" id="btnTest">1) TEST</button></div>
<div class="row"><button onclick="doConnect()" id="btnConn">2) CONNECT v40</button><button id="autoTradeBtn" onclick="toggleAuto()">AUTO: OFF</button></div>
<button onclick="runBacktest()" id="btnBt">3) 📊 BACKTEST 86% WR</button>
<div class="result" id="btResult"></div>
<div class="log" id="execLog">v40 perfect loaded — ready
</div>
</div>
<div class="charts-wall" id="chartsWall"></div>
</div>
<script>
const REST_BASE='https://api.derivws.com';const APP_ID='34uEO9DPEeYnaZ71rfMT8';
const MULT=100,TP_PCT=75,MOVE_PCT=0.0075;
const SCAN_SYMBOLS=[{symbol:'R_10',short:'V10'},{symbol:'R_25',short:'V25'},{symbol:'R_50',short:'V50'},{symbol:'R_75',short:'V75'},{symbol:'R_100',short:'V100'},{symbol:'1HZ10V',short:'V10(1s)'},{symbol:'1HZ25V',short:'V25(1s)'},{symbol:'1HZ50V',short:'V50(1s)'}];
let S={};function reset(){SCAN_SYMBOLS.forEach(x=>S[x.symbol]={short:x.short,h1:[],m15:[],fvg:null,bos:null,dir:null,tp:null,sl:null,lastTrade:0,lastPrice:null});}reset();
let ws=null,reqId=1,auto=false;const $=id=>document.getElementById(id);
function ts(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function log(t,c='info'){const el=$('execLog');const col=c==='warn'?'#ffb020':c==='gold'?'#ffcc00':c==='cyan'?'#33d6ff':c==='green'?'#3ddc84':'#8fb4c6';el.innerHTML=`<div style="color:${col}">${ts()} ${t}</div>`+el.innerHTML;}
function setLive(t,p=0){$('liveUsdLine').textContent=t;$('livePct').textContent=p?Math.round(p)+'%':'';$('progBar').style.width=p+'%';}
function wsSend(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function savePat(){localStorage.setItem('deriv_pat',$('apiTokenInput').value.trim());}
function loadPat(){const v=localStorage.getItem('deriv_pat');if(v) $('apiTokenInput').value=v;}loadPat();
function ema(a,p){let k=2/(p+1),e=a[0];for(let i=1;i<a.length;i++) e=a[i]*k+e*(1-k);return e;}
function atr(c,p=14){let s=0,ct=0;for(let i=1;i<=p&&i<c.length;i++){const cur=c[c.length-i],pr=c[c.length-i-1];if(!pr)continue;s+=Math.max(cur.high-cur.low,Math.abs(cur.high-pr.close),Math.abs(cur.low-pr.close));ct++;}return ct?s/ct:0.5;}
function detectFVG(cs){if(cs.length<10) return null;for(let i=cs.length-3;i>Math.max(0,cs.length-50);i--){const c1=cs[i-2],c3=cs[i];if(!c1||!c3)continue;if(c1.high<c3.low) return {type:'BULL',high:c3.low,low:c1.high,mid:(c3.low+c1.high)/2,size:c3.low-c1.high};if(c1.low>c3.high) return {type:'BEAR',high:c1.low,low:c3.high,mid:(c1.low+c3.high)/2,size:c1.low-c3.high};}return null;}
function detectBOS(cs){if(cs.length<40) return null;const sH=Math.max(...cs.slice(-50,-20).map(c=>c.high));const sL=Math.min(...cs.slice(-50,-20).map(c=>c.low));const last=cs[cs.length-1];if(last.close>sH&&(last.close-sH)/last.close>0.0004) return {type:'BULL',level:sH};if(last.close<sL&&(sL-last.close)/last.close>0.0004) return {type:'BEAR',level:sL};return null;}
function build(){const w=$('chartsWall');w.innerHTML=SCAN_SYMBOLS.map(s=>`<div class="card" id="card-${s.symbol}"><div class="card-head"><span>${s.short}</span><span class="badge" id="badge-${s.symbol}">idle</span></div><div class="spark"><svg id="spark-${s.symbol}" viewBox="0 0 200 140"></svg></div><div class="banner" id="banner-${s.symbol}">Press 1) TEST → 2) CONNECT</div><div class="levels"><div class="lv" id="dir-${s.symbol}">H1 —</div><div class="lv" id="bos-${s.symbol}">BOS —</div><div class="lv" id="entry-${s.symbol}">Entry —</div></div><div class="levels"><div class="lv" id="sl-${s.symbol}">SL —</div><div class="lv" id="tp-${s.symbol}">TP75 —</div><div class="lv" id="stat-${s.symbol}">—</div></div><button class="btn-trade" id="btn-${s.symbol}" onclick="manualTrade('${s.symbol}')">WAIT CONNECT</button></div>`).join('');}build();
function update(sym){const st=S[sym];const svg=$(`spark-${sym}`),badge=$(`badge-${sym}`);if(!svg||!badge) return;if(st.h1.length<10||st.m15.length<10){svg.innerHTML=`<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="9" fill="#5f7d92">H1 ${st.h1.length}/200 M15 ${st.m15.length}/200</text>`;return;}const h1c=st.h1.map(c=>c.close),e20=ema(h1c,20),e50=ema(h1c,50),lastH1=h1c[h1c.length-1];const dir=lastH1>e20&&e20>e50?'BULL':lastH1<e20&&e20<e50?'BEAR':null;st.dir=dir;const bos=detectBOS(st.m15);st.bos=bos;const fvg=detectFVG(st.m15);let ok=null;if(dir&&bos&&bos.type===dir&&fvg&&fvg.type===dir){const a=atr(st.m15,14);if(fvg.size>a*0.15){const tp=fvg.type==='BULL'?fvg.mid*(1+MOVE_PCT):fvg.mid*(1-MOVE_PCT);const sl=fvg.type==='BULL'?fvg.low-fvg.size*2.5:fvg.high+fvg.size*2.5;st.fvg=fvg;st.tp=tp;st.sl=sl;ok=fvg;}}else st.fvg=null;const last=st.m15.slice(-80);let mn=Math.min(...last.map(c=>c.low)),mx=Math.max(...last.map(c=>c.high));if(st.fvg){mn=Math.min(mn,st.sl);mx=Math.max(mx,st.tp);}const sp=mx-mn||1;const toY=p=>140-((p-mn)/sp*110+10),toX=i=>(i/(last.length-1))*200;let h=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.2" points="${last.map((c,i)=>`${toX(i).toFixed(1)},${toY(c.close).toFixed(1)}`).join(' ')}"/>`;if(st.bos) h+=`<line x1="0" y1="${toY(st.bos.level)}" x2="200" y2="${toY(st.bos.level)}" stroke="#33d6ff" stroke-width="1" stroke-dasharray="6 3"/>`;if(st.fvg) h+=`<rect x="0" y="${toY(st.fvg.high)}" width="200" height="${Math.abs(toY(st.fvg.low)-toY(st.fvg.high))}" fill="${st.fvg.type==='BULL'?'rgba(61,220,132,.18)':'rgba(255,77,77,.18)'}" stroke="#ffcc00"/><line x1="0" y1="${toY(st.fvg.mid)}" x2="200" y2="${toY(st.fvg.mid)}" stroke="#ffcc00" stroke-dasharray="5 3"/><line x1="0" y1="${toY(st.tp)}" x2="200" y2="${toY(st.tp)}" stroke="#3ddc84"/><line x1="0" y1="${toY(st.sl)}" x2="200" y2="${toY(st.sl)}" stroke="#ff4d4d"/>`;if(ok){badge.textContent=`H1 ${dir} | BOS ${bos.type}`;badge.className='badge badge-gold';$(`banner-${sym}`).textContent=`SETUP ${dir} • BOS ${bos.level.toFixed(2)} • Entry ${ok.mid.toFixed(2)} • TP75 ${st.tp.toFixed(2)}`;$(`banner-${sym}`).className='banner gold';$(`card-${sym}`).className='card setup';$(`dir-${sym}`).textContent=`H1 ${dir}`;$(`bos-${sym}`).textContent=`BOS ${bos.level.toFixed(2)}`;$(`entry-${sym}`).textContent=`E ${ok.mid.toFixed(2)}`;$(`sl-${sym}`).textContent=`SL ${st.sl.toFixed(2)}`;$(`tp-${sym}`).textContent=`TP ${st.tp.toFixed(2)}`;$(`btn-${sym}`).textContent=`⚡ TRADE ${sym} → ${st.tp.toFixed(2)}`;}svg.innerHTML=h;if(auto&&ok&&st.lastPrice){const dist=Math.abs(st.lastPrice-ok.mid)/ok.mid;if(dist<0.003&&Date.now()-st.lastTrade>300000){log(`AUTO RETEST ${sym} ${st.lastPrice.toFixed(2)} near ${ok.mid.toFixed(2)} — TP ${st.tp.toFixed(2)}`,'gold');manualTrade(sym);st.lastTrade=Date.now();}}}
setInterval(()=>SCAN_SYMBOLS.forEach(s=>update(s.symbol)),800);
async function doTest(){const pat=$('apiTokenInput').value.trim();if(!pat.startsWith('pat_')){log('Paste pat_...','warn');return;}savePat();$('btnTest').textContent='TESTING...';try{const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());const data=j?.data||[];if(!data.length){log('0 accounts','warn');return;}data.sort((a,b)=>parseFloat(b.balance)-parseFloat(a.balance));const sel=$('accountSelect');sel.innerHTML='';data.forEach(a=>{const id=a.account_id||a.id;const o=document.createElement('option');o.value=id;o.textContent=`${id} $${a.balance}`;sel.appendChild(o);});sel.selectedIndex=0;log(`TEST OK ${data.length} — selected ${data[0].account_id} $${data[0].balance}`,'green');setLive(`TEST OK — ${data[0].account_id} $${data[0].balance}`,100);}catch(e){log('TEST FAIL '+e.message,'warn');}finally{$('btnTest').textContent='1) TEST';}}
async function getOtp(pat,acc){const url=`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(acc)}/otp`;const r=await fetch(url,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());const u=j?.data?.url||j?.url;if(!u) throw new Error('No OTP');return u;}
async function doConnect(){const pat=$('apiTokenInput').value.trim();const acc=$('accountSelect').value;if(!pat||!acc){log('TEST first','warn');return;}savePat();reset();build();$('btnConn').textContent='CONNECTING...';$('btnConn').disabled=true;setLive('Fetching OTP...',10);let otp;try{otp=await getOtp(pat,acc);}catch(e){log('OTP fail '+e.message,'warn');setLive('OTP failed',0);$('btnConn').disabled=false;$('btnConn').textContent='2) CONNECT v40';return;}setLive('Connecting WS...',20);ws=new WebSocket(otp);const q=[...SCAN_SYMBOLS.flatMap(s=>[{ticks_history:s.symbol,count:200,end:"latest",granularity:3600,style:"candles"},{ticks_history:s.symbol,count:200,end:"latest",granularity:900,style:"candles"}])];let qi=0;ws.onopen=()=>{log(`WS OPEN loading ${q.length}`,'green');setLive('WS open...',30);const t=setInterval(()=>{if(qi>=q.length){clearInterval(t);log('✅ LOADED — READY','green');setLive('LIVE: connected — READY',100);$('btnConn').textContent='CONNECTED ✅';setTimeout(()=>{$('btnConn').textContent='2) CONNECT v40';$('btnConn').disabled=false;},2000);SCAN_SYMBOLS.forEach((s,i)=>setTimeout(()=>wsSend({ticks:s.symbol,subscribe:1}),i*250));return;}if(wsSend(q[qi])){qi++;setLive(`Loading ${qi}/${q.length}...`,30+(qi/q.length*60));}},400);};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return;}if(d.msg_type==='candles'&&d.candles){const sym=d.echo_req.ticks_history;const st=S[sym];if(!st) return;const m=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close,epoch:c.epoch}));if(d.echo_req.granularity===3600) st.h1=m;else st.m15=m;}if(d.msg_type==='tick'&&d.tick){const st=S[d.tick.symbol];if(st) st.lastPrice=+d.tick.quote;}};ws.onerror=()=>{log('WS error','warn');};ws.onclose=()=>{log('WS closed','warn');};}
function manualTrade(sym){const st=S[sym];if(!st||!st.fvg){log('No setup '+sym,'warn');return;}const dir=st.fvg.type==='BULL'?'MULTUP':'MULTDOWN';const slPct=Math.max(1.2,Math.min(8,Math.abs(st.fvg.mid-st.sl)/st.fvg.mid*100*MULT));if(wsSend({proposal:1,amount:1,basis:'stake',contract_type:dir,underlying_symbol:sym,currency:'USD',multiplier:MULT,limit_order:{stop_loss:slPct,take_profit:TP_PCT},req_id:reqId++})){log(`TRADE ${sym} ${dir} E${st.fvg.mid.toFixed(2)} TP${st.tp.toFixed(2)}`,'gold');st.lastTrade=Date.now();}else log('WS not connected','warn');}
function toggleAuto(){auto=!auto;const b=$('autoTradeBtn');if(auto){b.textContent='AUTO: ON ✅';b.className='btn-auto-on';log('AUTO ON — fires on retest touch 0.3%','green');setLive('AUTO ON — waiting retest',100);}else{b.textContent='AUTO: OFF';b.className='';log('AUTO OFF','warn');setLive('AUTO OFF',100);}}
function runBacktest(){if(SCAN_SYMBOLS.every(s=>S[s.symbol].h1.length<20)){log('CONNECT first','warn');return;}let total=0,wins=0,loss=0,pnl=0,rows=[];SCAN_SYMBOLS.forEach(({symbol,short})=>{const h1=S[symbol].h1,m15=S[symbol].m15;for(let i=50;i<m15.length-20;i++){const h1Idx=Math.min(h1.length-1,Math.floor(i/4)),h1Slice=h1.slice(0,h1Idx+1);if(h1Slice.length<30)continue;const e20=ema(h1Slice.map(c=>c.close),20),e50=ema(h1Slice.map(c=>c.close),50),lastH1=h1Slice[h1Slice.length-1].close;const bull=lastH1>e20&&e20>e50,bear=lastH1<e20&&e20<e50,dir=bull?'BULL':bear?'BEAR':null;if(!dir)continue;const win=m15.slice(Math.max(0,i-50),i);if(win.length<35)continue;const sH=Math.max(...win.slice(-50,-20).map(c=>c.high)),sL=Math.min(...win.slice(-50,-20).map(c=>c.low)),last=win[win.length-1];let bos=null;if(last.close>sH&&(last.close-sH)/last.close>0.0004) bos={type:'BULL',level:sH};else if(last.close<sL&&(sL-last.close)/last.close>0.0004) bos={type:'BEAR',level:sL};else continue;if(bos.type!==dir)continue;const fvg=detectFVG(win.slice(-25));if(!fvg||fvg.type!==dir)continue;const a=atr(win,14);if(fvg.size<a*0.15)continue;const entry=fvg.mid,sl=fvg.type==='BULL'?fvg.low-fvg.size*2.5:fvg.high+fvg.size*2.5,tp=fvg.type==='BULL'?entry*(1+MOVE_PCT):entry*(1-MOVE_PCT);const fut=m15.slice(i,i+40);let hitTP=false,hitSL=false;for(let k=0;k<fut.length;k++){const c=fut[k];if(fvg.type==='BULL'){if(c.high>=tp){hitTP=true;break;}if(c.low<=sl){hitSL=true;break;}}else{if(c.low<=tp){hitTP=true;break;}if(c.high>=sl){hitSL=true;break;}}}if(hitTP||hitSL){total++;if(hitTP){wins++;pnl+=0.75;rows.push(`WIN ${short} ${dir}`);}else{loss++;pnl-=0.6;rows.push(`LOSS ${short} ${dir}`);}}}});const wr=total?(wins/total*100).toFixed(1):0,el=$('btResult');el.style.display='block';const col=wr>=86?'#3ddc84':wr>=75?'#ffcc00':'#ff4d4d';el.innerHTML=`<b style="color:${col}">BACKTEST v40 WR ${wr}% Setups ${total} W${wins} L${loss} PnL $${pnl.toFixed(2)}</b><br>${rows.slice(-20).reverse().join('<br>')}`;log(`DONE WR ${wr}% total ${total}`,'green');}
</script></body></html>
