<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SNIPER v31 — CHARTS FIXED FVG 75%</title>
<style>
:root{--bg:#03070c;--panel:#071018;--line:#123041;--cyan:#33d6ff;--red:#ff4d4d;--green:#3ddc84;--gold:#ffcc00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#dff6ff;font-family:monospace}
.shell{padding:8px;display:grid;gap:8px}.topbar{background:#071018;border:1px solid #123041;border-radius:10px;padding:10px}
button,input,select{width:100%;background:#07141f;color:#33d6ff;border:1px solid #1a7a99;border-radius:8px;padding:11px;font-size:12px}
button{font-weight:800;min-height:42px}.log{font-size:9px;line-height:1.6;white-space:pre-wrap;max-height:160px;overflow:auto;background:#040b12;border:1px solid #123041;border-radius:8px;padding:8px}
.charts-wall{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:700px){.charts-wall{grid-template-columns:1fr 1fr}}
.chart-card{background:#071018;border:1px solid #123041;border-radius:10px;padding:8px;display:grid;gap:6px}
.chart-card.fvg-signal{border-color:#ffcc00;box-shadow:0 0 18px rgba(255,204,0,.35)}
.card-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800}
.card-badge{padding:3px 8px;border-radius:4px;font-size:9px;border:1px solid #123041}
.badge-fvg{color:#ffcc00;border-color:#ffcc00;background:rgba(255,204,0,.15)}.badge-neutral{color:#5f7d92}
.spark-box{height:140px;background:#040b12;border:1px solid #123041;border-radius:6px;overflow:hidden;position:relative}.spark-box svg{width:100%;height:100%;display:block}
.card-banner{border:1px solid #123041;border-radius:6px;padding:8px;text-align:center;font-size:10px;font-weight:800;min-height:42px;display:grid;place-items:center}
.card-banner.fvg{color:#ffcc00;border-color:#ffcc00;background:rgba(255,204,0,.12)}.card-banner.neutral{color:#5f7d92}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:9px}
.level{border:1px solid #123041;border-radius:6px;padding:6px;text-align:center}
.btn-buy-sm{background:#082d18;border:1px solid #3ddc84;color:#3ddc84;padding:6px;font-size:9px;min-height:32px}.btn-sell-sm{background:#2d0808;border:1px solid #ff4d4d;color:#ff4d4d;padding:6px;font-size:9px;min-height:32px}
.btn-fvg{background:#2a2200;border:1px solid #ffcc00;color:#ffcc00;padding:10px;font-size:11px;min-height:38px;grid-column:span 2;width:100%}
</style>
</head>
<body>
<div class="shell">
<div class="topbar">
<b style="color:#ffcc00">SNIPER v31 — CHARTS FIXED | FVG 75% TP</b>
<div id="liveUsdLine" style="font-size:11px;color:#ffb020">LIVE: not connected</div>
<input type="text" id="apiTokenInput" placeholder="Deriv pat_...">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
<select id="accountSelect"><option>TEST first</option></select>
<button onclick="doTest()">1) TEST</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button onclick="doConnect()" style="background:#2a2200;border:2px solid #ffcc00;color:#ffcc00">2) CONNECT v31</button>
<button id="autoTradeBtn" onclick="toggleAuto()">AUTO FVG: OFF</button>
</div>
<div id="acctLine" style="font-size:10px;color:#5f7d92;margin-top:8px;border:1px solid #123041;border-radius:6px;padding:6px">Fix: 200 candles + chart forced draw</div>
<div class="log" id="execLog">v31 loaded — chart fix active
</div>
</div>
<div class="charts-wall" id="chartsWall"></div>
</div>
<script>
const REST_BASE='https://api.derivws.com';const APP_ID='34uEO9DPEeYnaZ71rfMT8';
const SCAN_SYMBOLS=[{symbol:'R_10',short:'V10'},{symbol:'R_25',short:'V25'},{symbol:'R_50',short:'V50'},{symbol:'R_75',short:'V75'},{symbol:'R_100',short:'V100'},{symbol:'1HZ10V',short:'V10(1s)'},{symbol:'1HZ15V',short:'V15(1s)'},{symbol:'1HZ25V',short:'V25(1s)'},{symbol:'1HZ50V',short:'V50(1s)'}];
let symbolState={};SCAN_SYMBOLS.forEach(s=>symbolState[s.symbol]={short:s.short,candlesM15:[],fvg:null,lastPrice:null,entry:null,sl:null});
let wsTrade=null,reqIdCounter=1,tradePing=null,currentPat=null,queue=[],qIdx=0,autoFvg=false;
function ts(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function logLine(t,c='info'){const el=document.getElementById('execLog');const col=c==='warn'?'#ffb020':c==='fvg'?'#ffcc00':c==='buy'?'#3ddc84':'#8fb4c6';el.innerHTML=`<div style="color:${col}">${ts()} ${t}</div>`+el.innerHTML;}
function wsSend(s,o){if(s&&s.readyState===1){try{s.send(JSON.stringify(o));return true}catch(e){return false}}return false}
function detectFVG(candles){
 if(candles.length<10) return null;
 for(let i=candles.length-3;i>Math.max(0,candles.length-60);i--){
  const c1=candles[i-2], c3=candles[i];
  if(!c1||!c3) continue;
  if(c1.high < c3.low){ // BULL
   const gapHigh=c3.low, gapLow=c1.high; if(gapHigh-gapLow<=0) continue;
   return {type:'BULL',high:gapHigh,low:gapLow,mid:(gapHigh+gapLow)/2,size:gapHigh-gapLow,age:candles.length-1-i};
  }
  if(c1.low > c3.high){ // BEAR
   const gapHigh=c1.low, gapLow=c3.high; if(gapHigh-gapLow<=0) continue;
   return {type:'BEAR',high:gapHigh,low:gapLow,mid:(gapHigh+gapLow)/2,size:gapHigh-gapLow,age:candles.length-1-i};
  }
 } return null;
}
function buildWall(){const wall=document.getElementById('chartsWall');wall.innerHTML=SCAN_SYMBOLS.map(s=>`<div class="chart-card" id="card-${s.symbol}"><div class="card-head"><span>${s.short}</span><span class="card-badge badge-neutral" id="badge-${s.symbol}">queued</span></div><div class="spark-box"><svg id="spark-${s.symbol}" viewBox="0 0 200 140" preserveAspectRatio="none"></svg></div><div class="card-banner neutral" id="banner-${s.symbol}">queued</div><div class="levels"><div class="level" id="entry-${s.symbol}" style="border-color:#ffcc00;color:#ffcc00">Entry —</div><div class="level" id="sl-${s.symbol}" style="border-color:#ff4d4d;color:#ff4d4d">SL —</div><div class="level" id="tp-${s.symbol}" style="border-color:#3ddc84;color:#3ddc84">TP 75% —</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn-sell-sm" onclick="manualFvg('${s.symbol}','SELL')">SELL</button><button class="btn-buy-sm" onclick="manualFvg('${s.symbol}','BUY')">BUY</button></div><button class="btn-fvg" onclick="manualFvg('${s.symbol}','AUTO')">⚡ TRADE FVG 75% TP</button></div>`).join('');}
buildWall();
function updateCard(sym){
 const st=symbolState[sym];if(!st) return;
 const svg=document.getElementById(`spark-${sym}`);const badge=document.getElementById(`badge-${sym}`);const banner=document.getElementById(`banner-${sym}`);const card=document.getElementById(`card-${sym}`);
 if(!svg||!badge||!banner||!card) return;
 const src=st.candlesM15;
 if(src.length<2){
  badge.textContent=`Loading ${src.length}/200`; banner.textContent=`Loading candles...`; svg.innerHTML=`<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="10" fill="#5f7d92">Loading ${src.length} candles...</text>`; return;
 }
 const last=src.slice(-80);
 let min=Math.min(...last.map(c=>c.low)), max=Math.max(...last.map(c=>c.high));
 if(min===max){min-=0.5;max+=0.5;}
 const span=max-min||1;
 const toY=p=>140-((p-min)/span*110+10);
 const toX=i=> (i/(last.length-1))*200;
 let line=last.map((c,i)=>`${toX(i).toFixed(1)},${toY(c.close).toFixed(1)}`).join(' ');
 let html=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.5" points="${line}"/>`;
 if(st.fvg){
  const y1=toY(st.fvg.high), y2=toY(st.fvg.low);
  html+=`<rect x="0" y="${Math.min(y1,y2)}" width="200" height="${Math.abs(y1-y2)}" fill="${st.fvg.type==='BULL'?'rgba(61,220,132,.22)':'rgba(255,77,77,.22)'}" stroke="#ffcc00" stroke-width="1" stroke-dasharray="4 3"/>`;
  html+=`<line x1="0" y1="${toY(st.fvg.mid)}" x2="200" y2="${toY(st.fvg.mid)}" stroke="#ffcc00" stroke-width="1.2" stroke-dasharray="5 3"/>`;
  badge.textContent=`FVG ${st.fvg.type} mid ${st.fvg.mid.toFixed(2)} size ${st.fvg.size.toFixed(2)}`; badge.className='card-badge badge-fvg';
  banner.textContent=`FVG ${st.fvg.type} — Entry ${st.fvg.mid.toFixed(2)} | TP 75% LOCKED`; banner.className='card-banner fvg';
  card.className='chart-card fvg-signal';
  document.getElementById(`entry-${sym}`).textContent=`Entry ${st.fvg.mid.toFixed(2)}`;
  document.getElementById(`sl-${sym}`).textContent=`SL ${(st.fvg.type==='BULL'?st.fvg.low:st.fvg.high).toFixed(2)}`;
  document.getElementById(`tp-${sym}`).textContent=`TP 75%`;
 } else {
  badge.textContent=`NO FVG - ${src.length} candles`; badge.className='card-badge badge-neutral';
  banner.textContent=`Scanning ${src.length} candles — chart OK`; banner.className='card-banner neutral';
  card.className='chart-card';
 }
 svg.innerHTML=html;
}
setInterval(()=>SCAN_SYMBOLS.forEach(s=>updateCard(s.symbol)),600);
async function doTest(){
 const pat=document.getElementById('apiTokenInput').value.trim();
 if(!pat.startsWith('pat_')){logLine('pat_ invalid','warn');return;}
 try{
  const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});
  const txt=await r.text();const j=JSON.parse(txt);const data=j?.data||[];const sel=document.getElementById('accountSelect');sel.innerHTML='';
  data.forEach(a=>{const id=a.account_id||a.id;const opt=document.createElement('option');opt.value=id;opt.textContent=`${id} $${a.balance}`;sel.appendChild(opt);});
  logLine(`TEST OK ${data.length} accounts`,'buy');
 }catch(e){logLine(e.message,'warn');}
}
async function fetchAccounts(pat){const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});return JSON.parse(await r.text());}
async function fetchOtp(pat,acc){const r=await fetch(`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(acc)}/otp`,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());return j?.data?.url||j?.url;}
async function doConnect(){
 const pat=document.getElementById('apiTokenInput').value.trim();const accId=document.getElementById('accountSelect').value;
 if(!pat||!accId){logLine('TEST first','warn');return;}
 currentPat=pat;
 const js=await fetchAccounts(pat);const accs=js?.data||[];const ch=accs.find(a=>(a.account_id||a.id)===accId)||accs[0];
 const otp=await fetchOtp(pat,accId);
 const sock=new WebSocket(otp);wsTrade=sock;
 sock.onopen=()=>{
  logLine(`CONNECT v31 ${accId} — loading 200 M15`,'fvg');
  queue=[];SCAN_SYMBOLS.forEach(s=>queue.push({ticks_history:s.symbol,adjust_start_time:1,count:200,end:"latest",granularity:900,style:"candles"}));
  qIdx=0;
  const t=setInterval(()=>{
   if(qIdx>=queue.length){clearInterval(t);logLine(`✅ All 200-candle history loaded — charts should show`,'buy');SCAN_SYMBOLS.forEach((s,i)=>setTimeout(()=>wsSend(sock,{ticks:s.symbol,subscribe:1}),i*400));return;}
   wsSend(sock,queue[qIdx]); qIdx++;
  },600);
 };
 sock.onmessage=(ev)=>{
  let d;try{d=JSON.parse(ev.data)}catch(e){return;}
  if(d.msg_type==='candles'&&d.candles){
   const sym=d.echo_req.ticks_history;const st=symbolState[sym];if(!st) return;
   const mapped=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close,epoch:c.epoch}));
   st.candlesM15=mapped;
   const f=detectFVG(mapped);
   if(f){st.fvg=f; logLine(`⚡ FVG FOUND ${sym} ${f.type} mid ${f.mid.toFixed(2)} size ${f.size.toFixed(2)}`,'fvg');}
   else logLine(`${sym} ${mapped.length} candles — no FVG yet`,'info');
  }
  if(d.msg_type==='tick'&&d.tick){
   const sym=d.tick.symbol||d.echo_req?.ticks_history||d.tick.underlying_symbol; if(!sym) return;
   const st=symbolState[sym];if(!st) return;
   st.lastPrice=+d.tick.quote;
   const epoch=d.tick.epoch;
   const arr=st.candlesM15; if(arr.length===0) return;
   const ce=Math.floor(epoch/900)*900; const last=arr[arr.length-1];
   if(last.epoch===ce){last.high=Math.max(last.high,st.lastPrice);last.low=Math.min(last.low,st.lastPrice);last.close=st.lastPrice;}
   else if(epoch>last.epoch){arr.push({open:st.lastPrice,high:st.lastPrice,low:st.lastPrice,close:st.lastPrice,epoch:ce}); if(arr.length>300) arr.shift(); const f=detectFVG(arr); if(f) st.fvg=f;}
  }
 };
 sock.onclose=()=>{logLine('Socket closed — reconnect in 4s','warn'); setTimeout(()=>doConnect(),4000);}
}
function manualFvg(sym,dir){
 const st=symbolState[sym];if(!st||!st.fvg){logLine(`No FVG for ${sym}`,'warn');return;}
 const finalDir=dir==='AUTO'? (st.fvg.type==='BULL'?'BUY':'SELL'):dir;
 const slPct=Math.max(1,Math.min(5, st.fvg.size/st.fvg.mid*100*2));
 wsSend(wsTrade,{proposal:1,amount:1,basis:'stake',contract_type:finalDir==='BUY'?'MULTUP':'MULTDOWN',underlying_symbol:sym,currency:'USD',multiplier:100,limit_order:{stop_loss:slPct,take_profit:75},req_id:reqIdCounter++});
 logLine(`FVG TRADE ${sym} ${finalDir} Entry ${st.fvg.mid.toFixed(2)} TP 75% LOCKED SL ${slPct.toFixed(2)}%`,'fvg');
}
function toggleAuto(){autoFvg=!autoFvg;document.getElementById('autoTradeBtn').innerText=`AUTO FVG: ${autoFvg?'ON':'OFF'}`; document.getElementById('autoTradeBtn').style.borderColor=autoFvg?'#ffcc00':'#5f7d92'; logLine(autoFvg?'AUTO ON — will enter on FVG retest':'AUTO OFF','fvg');}
</script>
</body>
</html>
