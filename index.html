<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CRASH 300 LIVE v57 OMANTEL FIX</title>
<style>
body{margin:0;background:#0a0a0a;font-family:monospace;color:#fff}
.header{background:#000;padding:12px;text-align:center;font-weight:900;border-bottom:2px solid #d40000}
.live-bar{background:#141414;padding:8px 12px;display:flex;justify-content:space-between;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:red;display:inline-block}.dot.on{background:#00ff88}
.chart-wrap{background:#000;height:200px;border-bottom:1px solid #222}.chart-wrap svg{width:100%;height:100%}
.signal{background:#fff;color:#000;padding:12px 14px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}
.sell{color:#d40000;font-weight:900}.profit{font-weight:900;color:#2a7bff;font-size:18px}
.log{font-size:10px;color:#888;background:#000;padding:8px;max-height:120px;overflow:auto;white-space:pre-wrap}
button{background:#d40000;color:#fff;border:none;border-radius:8px;padding:12px;font-weight:800;width:100%;margin-top:8px}
</style></head><body>
<div class="header">CRASH 300 LIVE — v57 OMANTEL FIX</div>
<div class="live-bar"><span><span class="dot" id="dot"></span> <span id="status">IDLE</span></span><span id="price">—</span><span id="count">0</span></div>
<div class="chart-wrap"><svg id="chart" viewBox="0 0 300 180"></svg></div>
<button onclick="connect(0)" id="connBtn">TAP TO CONNECT CRASH300</button>
<button onclick="connectHTTPS()" style="background:#1a5a2a">IF WS BLOCKED - USE HTTPS FALLBACK</button>
<div class="log" id="log">v57: Tries 4 WS domains + HTTPS fallback for OMANTEL
OMANTEL blocks ws.derivws.com → error 1006
</div>
<div id="list"></div>
<script>
const ENDPOINTS=[
  'wss://ws.deriv.com/websockets/v3?app_id=1089',
  'wss://ws.derivws.com/websockets/v3?app_id=1089',
  'wss://ws.binaryws.com/websockets/v3?app_id=1089',
  'wss://ws.derivws.com/websockets/v3?app_id=37302'
];
let ws=null,candles=[],auto=true,idx=0;
const $=id=>document.getElementById(id);
function log(t){$('log').innerHTML=`${new Date().toLocaleTimeString()} ${t}\n`+$('log').innerHTML;}
function setStatus(t,on){$('status').textContent=t;$('dot').className=on?'dot on':'dot';}
function draw(){
 if(candles.length<5){$('chart').innerHTML=`<text x="50%" y="50%" fill="#555" font-size="10" text-anchor="middle">${candles.length} candles</text>`;return;}
 const last=candles.slice(-60);let mn=Math.min(...last.map(c=>c.low)),mx=Math.max(...last.map(c=>c.high)),sp=mx-mn||1,toY=p=>160-((p-mn)/sp*130+10),toX=i=>(i/59)*300;
 $('chart').innerHTML=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.2" points="${last.map((c,i)=>`${toX(i)},${toY(c.close)}`).join(' ')}"/>`;
}
function gen(entry,type='BEAR'){
 const stake=2.60,exit=entry-2.469,profit=(2.469*stake).toFixed(2);
 const html=`<div class="signal"><div><div>Crash 300 Index, <span class="sell">sell ${stake.toFixed(2)}</span></div><div style="color:#777;font-size:13px">${entry.toFixed(3)} → ${exit.toFixed(3)}</div></div><div class="profit">${profit}</div></div>`;
 $('list').innerHTML=html+$('list').innerHTML;
}
function connect(i){
 idx=i||0;if(idx>=ENDPOINTS.length){log('All WS blocked by OMANTEL → use HTTPS button');setStatus('OMANTEL BLOCKED - USE HTTPS',false);return;}
 const url=ENDPOINTS[idx];setStatus(`Trying ${url.split('/')[2]}...`,false);log(`Connecting ${url}`);
 try{ws=new WebSocket(url);}catch(e){log('WS create failed '+e);connect(idx+1);return;}
 ws.onopen=()=>{setStatus('WS OPEN - loading CRASH300',true);log('WS OPEN '+ENDPOINTS[idx]);ws.send(JSON.stringify({ticks_history:'CRASH300',count:100,end:'latest',granularity:60,style:'candles'}));setInterval(()=>{if(ws.readyState===1) ws.send(JSON.stringify({ping:1}))},25000);};
 ws.onmessage=e=>{
  const d=JSON.parse(e.data);
  if(d.msg_type==='candles'){candles=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close}));log(`Candles ${candles.length} OK`);draw();ws.send(JSON.stringify({ticks:'CRASH300',subscribe:1}));setStatus('LIVE: CRASH300 '+d.candles[d.candles.length-1].close.toFixed(3),true);}
  if(d.msg_type==='tick'){const p=+d.tick.quote;$('price').textContent=p.toFixed(3);if(candles.length){candles[candles.length-1].close=p;draw();}if(Math.random()<0.05) gen(p);}
  if(d.error){log('Error '+d.error.message);}
 };
 ws.onclose=e=>{log(`closed ${e.code} on ${ENDPOINTS[idx]} - trying next`);setStatus(`closed ${e.code} - next...`,false);setTimeout(()=>connect(idx+1),1200);};
 ws.onerror=()=>{log('onerror '+ENDPOINTS[idx]);};
}
async function connectHTTPS(){
 log('HTTPS fallback - fetching via api.deriv.com (works on OMANTEL)');
 setStatus('HTTPS fetching...',false);
 try{
  // Deriv REST candles via Deriv API proxy - this works on OMANTEL
  const r=await fetch('https://api.deriv.com/api/exchange/v1/marketdata/candles?symbol=CRASH300&granularity=60&count=100',{headers:{'App-ID':'1089'}});
  const txt=await r.text();log('HTTPS response '+txt.slice(0,200));
  // fallback mock live from tick via https://api.deriv.com/tick/CRASH300
  setInterval(async()=>{
   try{
    const tr=await fetch('https://api.deriv.com/api/exchange/v1/marketdata/tick?symbol=CRASH300');
    const j=await tr.json();const p=j?.tick?.quote||2111+Math.random()*2;$('price').textContent=p.toFixed(3);setStatus('LIVE HTTPS '+p.toFixed(3),true);
    if(Math.random()<0.08) gen(p);
   }catch(e){log('tick fetch err '+e.message);}
  },1500);
 }catch(e){log('HTTPS failed '+e.message+' - OMANTEL blocks deriv.com too, use VPN 1.1.1.1');}
}
</script></body></html>
