<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Crash 300 Signal Only</title>
<style>
body{margin:0;background:#f2f2f2;font-family:Arial,sans-serif}
.header{background:#0d1a26;color:#fff;padding:14px;text-align:center;font-weight:800}
.controls{padding:10px;background:#fff;display:grid;gap:8px;grid-template-columns:1fr 1fr}
input,button{padding:12px;border-radius:8px;border:1px solid #ccc;font-size:14px}button{background:#0d1a26;color:#33d6ff;font-weight:800}
.signal{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.left{display:grid;gap:2px}.top{font-size:16px;font-weight:800;color:#000}.top .sell{color:#d40000}
.mid{font-size:14px;color:#7a7a7a;font-weight:600}
.profit{font-size:22px;font-weight:800;color:#2a7bff}
</style></head><body>
<div class="header">CRASH 300 INDEX — SIGNAL GENERATOR</div>
<div class="controls">
<input id="entry" value="2111.681" placeholder="Entry">
<input id="lot" value="2.60" placeholder="Lot 2.60">
<button onclick="gen()">GENERATE SELL SIGNAL</button>
<button onclick="autoToggle()" id="autoBtn">AUTO: OFF</button>
</div>
<div id="list"></div>
<script>
let auto=false, timer=null;
function gen(){
 const e=parseFloat(document.getElementById('entry').value)||2111.681;
 const lot=parseFloat(document.getElementById('lot').value)||2.60;
 const diff=(Math.random()*1.5+1.5); // 1.5-3.0 pts like screenshot 2.469
 const exit=e-diff;
 const profit=(diff*lot*1.0).toFixed(2); // 2.469*2.60=6.42 like screenshot
 const html=`<div class="signal">
 <div class="left"><div class="top">Crash 300 Index, <span class="sell">sell ${lot.toFixed(2)}</span></div><div class="mid">${e.toFixed(3)} → ${exit.toFixed(3)}</div></div>
 <div class="profit">${profit}</div></div>`;
 document.getElementById('list').innerHTML=html+document.getElementById('list').innerHTML;
 document.getElementById('entry').value=(exit+(Math.random()*2-1)).toFixed(3);
}
function autoToggle(){
 auto=!auto;
 const b=document.getElementById('autoBtn');
 if(auto){b.textContent='AUTO: ON';timer=setInterval(gen,2000);}
 else{b.textContent='AUTO: OFF';clearInterval(timer);}
}
// generate 3 like your screenshot on load
gen();gen();gen();
</script></body></html>
