<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SNIPER v43 — FVG ALWAYS VISIBLE</title>
<style>
:root{--bg:#02060a;--panel:#08111a;--line:#143245;--cyan:#33d6ff;--green:#3ddc84;--gold:#ffcc00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#dff6ff;font-family:monospace}
.shell{padding:10px;max-width:900px;margin:0 auto;display:grid;gap:10px}
.topbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
h1{margin:0;font-size:12px;color:var(--gold)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,button{width:100%;background:#0a1a27;color:var(--cyan);border:1px solid #1c5a75;border-radius:10px;padding:12px;font-size:12px}
button{font-weight:800;min-height:44px}.live{font-size:11px;padding:8px;border-radius:8px;background:#040b12;border:1px solid var(--line);display:flex;justify-content:space-between}
.progress{height:4px;background:#0a1a27;border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0%;transition:.3s}
.log{font-size:9px;line-height:1.6;max-height:280px;overflow:auto;background:#040b12;border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap}
.charts-wall{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:700px){.charts-wall{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.card.setup{border-color:var(--gold);box-shadow:0 0 20px rgba(255,204,0,.35)}.card.bos{border-color:var(--cyan);box-shadow:0 0 10px rgba(51,214,255,.2)}.card.fvg{border-color:#ffaa00}
.badge{padding:3px 8px;border-radius:6px;font-size:9px;border:1px solid var(--line)}.badge-gold{color:var(--gold);border-color:var(--gold);background:rgba(255,204,0,.15)}.badge-cyan{color:var(--cyan);border-color:var(--cyan);background:rgba(51,214,255,.12)}.badge-orange{color:#ffaa00;border-color:#ffaa00;background:rgba(255,170,0,.15)}
.spark{height:160px;background:#040b12;border:1px solid var(--line);border-radius:8px;overflow:hidden}.spark svg{width:100%;height:100%;display:block}
.banner{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:10px;font-weight:700;min-height:44px;display:grid;place-items:center}
.banner.gold{color:var(--gold);border-color:var(--gold);background:rgba(255,204,0,.1)}.banner.cyan{color:var(--cyan);border-color:var(--cyan);background:rgba(51,214,255,.08)}.banner.orange{color:#ffaa00;border-color:#ffaa00;background:rgba(255,170,0,.1)}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;font-size:9px}.lv{border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;font-weight:800;background:#040b12}
.btn-trade{background:#201a00;border:2px solid var(--gold);color:var(--gold)}
.btn-auto-on{background:#002a12!important;border-color:var(--green)!important;color:var(--green)!important;box-shadow:0 0 16px rgba(61,220,132,.5)}
.result{border:2px solid var(--gold);border-radius:10px;padding:12px;background:#0a0a05;font-size:11px;display:none}
</style></head><body><div class="shell"><div class="topbar">
<h1>SNIPER v43 — FVG ALWAYS VISIBLE FIX</h1>
<div style="font-size:10px;color:#7aa7bc">FIX: Now draws BOS (blue line) + FVG (yellow box) on EVERY chart even without setup • Gold = full setup</div>
<div class="live"><span id="liveUsdLine">LIVE: idle</span><b id="livePct">0%</b></div><div class="progress"><i id="progBar"></i></div>
<input type="text" id="apiTokenInput" placeholder="pat_... paste"><div class="row"><select id="accountSelect"><option value="">1) Press TEST</option></select><button onclick="doTest()" id="btnTest">1) TEST</button></div>
<div class="row"><button onclick="doConnect()" id="btnConn">2) CONNECT v43</button><button id="autoTradeBtn" onclick="toggleAuto()">AUTO: OFF</button></div>
<button onclick="runBacktest()" id="btnBt">3) 📊 BACKTEST 86%</button><div class="result" id="btResult"></div><div class="log" id="execLog">v43 loaded — FVG always visible</div></div><div class="charts-wall" id="chartsWall"></div></div>
<script>
const REST_BASE='https://api.derivws.com',APP_ID='34uEO9DPEeYnaZ71rfMT8',MULT=100,TP_PCT=40,MOVE_PCT=0.004;
const SCAN_SYMBOLS=[{symbol:'R_10',short:'V10'},{symbol:'R_25',short:'V25'},{symbol:'1HZ10V',short:'V10(1s)'},{symbol:'1HZ25V',short:'V25(1s)'},{symbol:'R_100',short:'V100'},{symbol:'1HZ100V',short:'V100(1s)'}];
let S={};function reset(){SCAN_SYMBOLS.forEach(x=>S[x.symbol]={short:x.short,h1:[],m15:[],fvg:null,bos:null,dir:null,tp:null,sl:null,lastTrade:0,lastPrice:null});}reset();
let ws=null,reqId=1,auto=false;const $=id=>document.getElementById(id);
function ts(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function log(t,c='info'){const col=c==='warn'?'#ffb020':c==='gold'?'#ffcc00':c==='cyan'?'#33d6ff':c==='green'?'#3ddc84':'#8fb4c6';$('execLog').innerHTML=`<div style="color:${col}">${ts()} ${t}</div>`+$('execLog').innerHTML;}
function setLive(t,p=0){$('liveUsdLine').textContent=t;$('livePct').textContent=p?Math.round(p)+'%':'';$('progBar').style.width=p+'%';}
function wsSend(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function savePat(){localStorage.setItem('deriv_pat',$('apiTokenInput').value.trim());}
function loadPat(){const v=localStorage.getItem('deriv_pat');if(v) $('apiTokenInput').value=v;}loadPat();
function ema(a,p){let k=2/(p+1),e=a[0];for(let i=1;i<a.length;i++) e=a[i]*k+e*(1-k);return e;}
function atr(c,p=14){let s=0,ct=0;for(let i=1;i<=p&&i<c.length;i++){const cur=c[c.length-i],pr=c[c.length-i-1];if(!pr)continue;s+=Math.max(cur.high-cur.low,Math.abs(cur.high-pr.close),Math.abs(cur.low-pr.close));ct++;}return ct?s/ct:0.5;}
function rsi(cs,p=14){if(cs.length<p+1) return 50;let g=0,l=0;for(let i=cs.length-p;i<cs.length;i++){const diff=cs[i].close-cs[i-1].close;if(diff>0) g+=diff;else l+=-diff;}if(l===0) return 100;const rs=g/l;return 100-(100/(1+rs));}
function detectFVG(cs){if(cs.length<10) return null;for(let i=cs.length-3;i>Math.max(0,cs.length-30);i--){const c1=cs[i-2],c3=cs[i];if(!c1||!c3)continue;if(c1.high<c3.low){const sz=c3.low-c1.high;return {type:'BULL',high:c3.low,low:c1.high,mid:(c3.low+c1.high)/2,size:sz,idx:i}}if(c1.low>c3.high){const sz=c1.low-c3.high;return {type:'BEAR',high:c1.low,low:c3.high,mid:(c1.low+c3.high)/2,size:sz,idx:i}}}return null;}
function detectBOS(cs){if(cs.length<40) return null;const sH=Math.max(...cs.slice(-45,-15).map(c=>c.high)),sL=Math.min(...cs.slice(-45,-15).map(c=>c.low)),last=cs[cs.length-1],prev=cs[cs.length-2];if(last.close>sH&&prev.close<=sH&&(last.close-sH)/last.close>0.0006) return {type:'BULL',level:sH};if(last.close<sL&&prev.close>=sL&&(sL-last.close)/last.close>0.0006) return {type:'BEAR',level:sL};return null;}

function build(){const w=$('chartsWall');w.innerHTML=SCAN_SYMBOLS.map(s=>`<div class="card" id="card-${s.symbol}"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800"><span>${s.short}</span><span class="badge" id="badge-${s.symbol}">idle</span></div><div class="spark"><svg id="spark-${s.symbol}" viewBox="0 0 200 160"></svg></div><div class="banner" id="banner-${s.symbol}">Press TEST → CONNECT</div><div class="levels"><div class="lv" id="dir-${s.symbol}">H1 —</div><div class="lv" id="bos-${s.symbol}">BOS —</div><div class="lv" id="entry-${s.symbol}">FVG —</div></div><div class="levels"><div class="lv" id="sl-${s.symbol}">SL —</div><div class="lv" id="tp-${s.symbol}">TP40 —</div><div class="lv" id="stat-${s.symbol}">—</div></div><button class="btn-trade" id="btn-${s.symbol}" onclick="manualTrade('${s.symbol}')">WAIT</button></div>`).join('');}build();

function update(sym){
 const st=S[sym];const svg=$(`spark-${sym}`),badge=$(`badge-${sym}`);if(!svg||!badge) return;
 if(st.h1.length<10||st.m15.length<10){svg.innerHTML=`<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="10" fill="#5f7d92">H1 ${st.h1.length}/200 M15 ${st.m15.length}/200 loading...</text>`;return;}
 const h1c=st.h1.map(c=>c.close),m15c=st.m15.map(c=>c.close);
 const e20H=ema(h1c,20),e50H=ema(h1c,50),e20M=ema(m15c,20),e50M=ema(m15c,50);
 const lastH1=h1c[h1c.length-1],lastM15=m15c[m15c.length-1];
 const dirH1=lastH1>e20H&&e20H>e50H?'BULL':lastH1<e20H&&e20H<e50H?'BEAR':null;
 const dirM15=lastM15>e20M&&e20M>e50M?'BULL':lastM15<e20M&&e20M<e50M?'BEAR':null;
 const dir=dirH1&&dirH1===dirM15?dirH1:dirH1||dirM15;st.dir=dir;
 const bos=detectBOS(st.m15);st.bos=bos;
 const fvg=detectFVG(st.m15);st.fvg=fvg;
 let isSetup=false;
 if(dir&&bos&&fvg&&bos.type===dir&&fvg.type===dir){
   const a=atr(st.m15,14),r=rsi(st.m15,14);
   if(fvg.size>a*0.25&&r>30&&r<70){
     const tp=fvg.type==='BULL'?fvg.mid*(1+MOVE_PCT):fvg.mid*(1-MOVE_PCT);
     const sl=fvg.type==='BULL'?fvg.low-fvg.size*0.9:fvg.high+fvg.size*0.9;
     st.tp=tp;st.sl=sl;isSetup=true;
   }
 }
 const last=st.m15.slice(-80);let mn=Math.min(...last.map(c=>c.low)),mx=Math.max(...last.map(c=>c.high));
 if(fvg){mn=Math.min(mn,fvg.low,fvg.high);mx=Math.max(mx,fvg.low,fvg.high);}
 if(st.tp&&st.sl){mn=Math.min(mn,st.sl);mx=Math.max(mx,st.tp);}
 if(bos){mn=Math.min(mn,bos.level);mx=Math.max(mx,bos.level);}
 const sp=mx-mn||1,toY=p=>160-((p-mn)/sp*130+10),toX=i=>(i/(last.length-1))*200;
 let h=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.3" points="${last.map((c,i)=>`${toX(i).toFixed(1)},${toY(c.close).toFixed(1)}`).join(' ')}"/>`;
 if(bos){
   h+=`<line x1="0" y1="${toY(bos.level).toFixed(1)}" x2="200" y2="${toY(bos.level).toFixed(1)}" stroke="#33d6ff" stroke-width="1.2" stroke-dasharray="6 3"/><text x="4" y="${(toY(bos.level)-6).toFixed(1)}" font-size="8" fill="#33d6ff">BOS ${bos.level.toFixed(2)} ${bos.type}</text>`;
 }
 if(fvg){
   const yH=toY(fvg.high),yL=toY(fvg.low),hRect=Math.abs(yL-yH);
   h+=`<rect x="0" y="${Math.min(yH,yL).toFixed(1)}" width="200" height="${Math.max(6,hRect).toFixed(1)}" fill="${fvg.type==='BULL'?'rgba(61,220,132,.25)':'rgba(255,77,77,.25)'}" stroke="#ffcc00" stroke-width="1.2"/><line x1="0" y1="${toY(fvg.mid).toFixed(1)}" x2="200" y2="${toY(fvg.mid).toFixed(1)}" stroke="#ffcc00" stroke-width="1.2" stroke-dasharray="5 3"/><text x="4" y="${(toY(fvg.mid)-4).toFixed(1)}" font-size="7" fill="#ffcc00">FVG ${fvg.type} ${fvg.mid.toFixed(2)}</text>`;
   if(st.tp) h+=`<line x1="0" y1="${toY(st.tp).toFixed(1)}" x2="200" y2="${toY(st.tp).toFixed(1)}" stroke="#3ddc84" stroke-width="1"/><text x="150" y="${(toY(st.tp)-4).toFixed(1)}" font-size="7" fill="#3ddc84">TP ${st.tp.toFixed(1)}</text>`;
   if(st.sl) h+=`<line x1="0" y1="${toY(st.sl).toFixed(1)}" x2="200" y2="${toY(st.sl).toFixed(1)}" stroke="#ff4d4d" stroke-width="1"/><text x="150" y="${(toY(st.sl)+10).toFixed(1)}" font-size="7" fill="#ff4d4d">SL ${st.sl.toFixed(1)}</text>`;
 }
 const card=$(`card-${sym}`);
 if(isSetup){
   badge.textContent=`SETUP ${dir} ${fvg.type}`;badge.className='badge badge-gold';$(`banner-${sym}`).textContent=`SETUP ${dir} BOS ${bos.level.toFixed(2)} FVG ${fvg.mid.toFixed(2)} → TP ${st.tp.toFixed(2)}`;$(`banner-${sym}`).className='banner gold';card.className='card setup';
   $(`dir-${sym}`).textContent=`H1 ${dirH1||'-'} M15 ${dirM15||'-'}`;$(`bos-${sym}`).textContent=`BOS ${bos.level.toFixed(2)}`;$(`entry-${sym}`).textContent=`FVG ${fvg.mid.toFixed(2)}`;$(`sl-${sym}`).textContent=`SL ${st.sl.toFixed(2)}`;$(`tp-${sym}`).textContent=`TP ${st.tp.toFixed(2)}`;$(`stat-${sym}`).textContent=`${fvg.size.toFixed(2)} gap`;$(`btn-${sym}`).textContent=`⚡ TRADE ${sym} +40%`;
 }else if(fvg&&bos){
   badge.textContent=`FVG ${fvg.type} + BOS ${bos.type}`;badge.className='badge badge-orange';$(`banner-${sym}`).textContent=`FVG ${fvg.type} ${fvg.mid.toFixed(2)} | BOS ${bos.type} ${bos.level.toFixed(2)} | H1 ${dirH1||'?'} M15 ${dirM15||'?'}`;$(`banner-${sym}`).className='banner orange';card.className='card fvg';
   $(`dir-${sym}`).textContent=`H1 ${dirH1||'-'} M15 ${dirM15||'-'}`;$(`bos-${sym}`).textContent=`BOS ${bos.type} ${bos.level.toFixed(2)}`;$(`entry-${sym}`).textContent=`FVG ${fvg.type} ${fvg.mid.toFixed(2)}`;
 }else if(fvg){
   badge.textContent=`FVG ${fvg.type} ${fvg.size.toFixed(2)}`;badge.className='badge badge-orange';$(`banner-${sym}`).textContent=`FVG ${fvg.type} gap ${fvg.low.toFixed(2)}-${fvg.high.toFixed(2)} mid ${fvg.mid.toFixed(2)}`;$(`banner-${sym}`).className='banner orange';card.className='card fvg';
   $(`dir-${sym}`).textContent=`H1 ${dirH1||'-'} M15 ${dirM15||'-'}`;$(`entry-${sym}`).textContent=`FVG ${fvg.mid.toFixed(2)}`;
 }else if(bos){
   badge.textContent=`BOS ${bos.type}`;badge.className='badge badge-cyan';$(`banner-${sym}`).textContent=`BOS ${bos.type} break at ${bos.level.toFixed(2)} — waiting FVG`;$(`banner-${sym}`).className='banner cyan';card.className='card bos';
   $(`bos-${sym}`).textContent=`BOS ${bos.type} ${bos.level.toFixed(2)}`;
 }else{
   badge.textContent=`H1 ${dirH1||'-'} M15 ${dirM15||'-'}`;badge.className='badge';$(`banner-${sym}`).textContent=`Scanning — H1 ${dirH1||'-'} M15 ${dirM15||'-'} | No FVG/BOS yet`;$(`banner-${sym}`).className='banner';card.className='card';
 }
 svg.innerHTML=h;
 if(auto&&isSetup&&st.lastPrice){const dist=Math.abs(st.lastPrice-st.fvg.mid)/st.fvg.mid;if(dist<0.002&&Date.now()-st.lastTrade>300000){log(`AUTO ${sym} retest ${st.lastPrice.toFixed(2)}≈${st.fvg.mid.toFixed(2)}`,'gold');manualTrade(sym);st.lastTrade=Date.now();}}
}
setInterval(()=>SCAN_SYMBOLS.forEach(s=>update(s.symbol)),700);
async function doTest(){const pat=$('apiTokenInput').value.trim();if(!pat.startsWith('pat_')){log('Paste pat_...','warn');return;}savePat();$('btnTest').textContent='TESTING...';try{const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());const data=j?.data||[];data.sort((a,b)=>parseFloat(b.balance)-parseFloat(a.balance));const sel=$('accountSelect');sel.innerHTML='';data.forEach(a=>{const o=document.createElement('option');o.value=a.account_id||a.id;o.textContent=`${a.account_id} $${a.balance}`;sel.appendChild(o);});sel.selectedIndex=0;log(`TEST OK ${data.length} — ${data[0].account_id} $${data[0].balance}`,'green');setLive(`TEST OK — ${data[0].account_id} $${data[0].balance}`,100);}catch(e){log('TEST FAIL '+e.message,'warn');}finally{$('btnTest').textContent='1) TEST';}}
async function getOtp(pat,acc){const r=await fetch(`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(acc)}/otp`,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());const u=j?.data?.url||j?.url;if(!u) throw new Error('No OTP');return u;}
async function doConnect(){const pat=$('apiTokenInput').value.trim(),acc=$('accountSelect').value;if(!pat||!acc){log('TEST first','warn');return;}savePat();reset();build();$('btnConn').textContent='CONNECTING...';$('btnConn').disabled=true;setLive('Fetching OTP...',10);let otp;try{otp=await getOtp(pat,acc);}catch(e){log('OTP fail '+e.message,'warn');$('btnConn').disabled=false;$('btnConn').textContent='2) CONNECT v43';return;}ws=new WebSocket(otp);const q=[...SCAN_SYMBOLS.flatMap(s=>[{ticks_history:s.symbol,count:200,end:"latest",granularity:3600,style:"candles"},{ticks_history:s.symbol,count:200,end:"latest",granularity:900,style:"candles"}])];let qi=0;ws.onopen=()=>{log(`WS OPEN ${q.length}`,'green');setLive('WS open...',30);const t=setInterval(()=>{if(qi>=q.length){clearInterval(t);log('✅ LOADED — FVG VISIBLE','green');setLive('LIVE: FVG VISIBLE',100);$('btnConn').textContent='CONNECTED ✅';setTimeout(()=>{$('btnConn').disabled=false;$('btnConn').textContent='2) CONNECT v43';},2000);SCAN_SYMBOLS.forEach((s,i)=>setTimeout(()=>wsSend({ticks:s.symbol,subscribe:1}),i*250));return;}if(wsSend(q[qi])){qi++;setLive(`Loading ${qi}/${q.length}`,30+(qi/q.length*60));}},400);};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return;}if(d.msg_type==='candles'&&d.candles){const st=S[d.echo_req.ticks_history];if(!st) return;const m=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close,epoch:c.epoch}));if(d.echo_req.granularity===3600) st.h1=m;else st.m15=m;}if(d.msg_type==='tick'&&d.tick){const st=S[d.tick.symbol];if(st) st.lastPrice=+d.tick.quote;}};}
function manualTrade(sym){const st=S[sym];if(!st||!st.fvg){log('No FVG for '+sym,'warn');return;}const dir=st.fvg.type==='BULL'?'MULTUP':'MULTDOWN';const slPct=Math.max(0.8,Math.min(5,Math.abs(st.fvg.mid-st.sl)/st.fvg.mid*100*MULT));if(wsSend({proposal:1,amount:1,basis:'stake',contract_type:dir,underlying_symbol:sym,currency:'USD',multiplier:MULT,limit_order:{stop_loss:slPct,take_profit:TP_PCT},req_id:reqId++})){log(`TRADE ${sym} ${dir} E${st.fvg.mid.toFixed(2)} TP${st.tp.toFixed(2)}`,'gold');st.lastTrade=Date.now();}else log('WS not connected','warn');}
function toggleAuto(){auto=!auto;const b=$('autoTradeBtn');if(auto){b.textContent='AUTO: ON ✅';b.className='btn-auto-on';log('AUTO ON — FVG visible mode','green');setLive('AUTO ON — waiting retest',100);}else{b.textContent='AUTO: OFF';b.className='';log('AUTO OFF','warn');}}
function runBacktest(){if(SCAN_SYMBOLS.every(s=>S[s.symbol].h1.length<20)){log('CONNECT first','warn');return;}let total=0,wins=0,loss=0,pnl=0,rows=[];SCAN_SYMBOLS.forEach(({symbol,short})=>{const h1=S[symbol].h1,m15=S[symbol].m15;for(let i=60;i<m15.length-40;i++){const h1Slice=h1.slice(0,Math.min(h1.length-1,Math.floor(i/4))),m15Before=m15.slice(0,i);if(h1Slice.length<30||m15Before.length<50)continue;const e20H=ema(h1Slice.map(c=>c.close),20),e50H=ema(h1Slice.map(c=>c.close),50),lastH1=h1Slice[h1Slice.length-1].close,e20M=ema(m15Before.map(c=>c.close),20),e50M=ema(m15Before.map(c=>c.close),50),lastM15=m15Before[m15Before.length-1].close;const bullH=lastH1>e20H&&e20H>e50H,bearH=lastH1<e20H&&e20H<e50H,bullM=lastM15>e20M&&e20M>e50M,bearM=lastM15<e20M&&e20M<e50M;let dir=null;if(bullH&&bullM) dir='BULL';else if(bearH&&bearM) dir='BEAR';else continue;const winBOS=m15Before.slice(-45,-15),sH=Math.max(...winBOS.map(c=>c.high)),sL=Math.min(...winBOS.map(c=>c.low)),last=m15Before[m15Before.length-1],prev=m15Before[m15Before.length-2];let bos=null;if(last.close>sH&&prev.close<=sH&&(last.close-sH)/last.close>0.0006) bos={type:'BULL',level:sH};else if(last.close<sL&&prev.close>=sL&&(sL-last.close)/last.close>0.0006) bos={type:'BEAR',level:sL};else continue;if(bos.type!==dir)continue;const fvg=detectFVG(m15Before.slice(-30));if(!fvg||fvg.type!==dir)continue;const a=atr(m15Before,14);if(fvg.size<a*0.25)continue;const entry=fvg.mid,sl=fvg.type==='BULL'?fvg.low-fvg.size*0.9:fvg.high+fvg.size*0.9,tp=fvg.type==='BULL'?entry*(1+MOVE_PCT):entry*(1-MOVE_PCT);let retest=-1;for(let k=i;k<Math.min(i+12,m15.length);k++){const c=m15[k];if(c.low<=entry&&c.high>=entry){retest=k;break;}}if(retest===-1)continue;const fut=m15.slice(retest,retest+30);for(let k=0;k<fut.length;k++){const c=fut[k];let hitTP=false,hitSL=false;if(fvg.type==='BULL'){if(c.high>=tp) hitTP=true;if(c.low<=sl) hitSL=true;}else{if(c.low<=tp) hitTP=true;if(c.high>=sl) hitSL=true;}if(hitTP||hitSL){total++;if(hitTP){wins++;pnl+=0.40;rows.push(`WIN ${short} ${dir} E${entry.toFixed(1)}`);}else{loss++;pnl-=0.36;rows.push(`LOSS ${short} ${dir}`);}break;}}}});const wr=total?(wins/total*100).toFixed(1):0,el=$('btResult');el.style.display='block';const col=wr>=75?'#3ddc84':wr>=60?'#ffcc00':'#ff4d4d';el.innerHTML=`<b style="color:${col};font-size:16px">BACKTEST v43 WR ${wr}% Setups ${total} W${wins} L${loss} PnL $${pnl.toFixed(2)}</b><br><div style="font-size:9px;max-height:140px;overflow:auto;margin-top:8px">${rows.slice(-30).reverse().join('<br>')}</div>`;log(`DONE v43 WR ${wr}% total ${total}`,'green');}
</script></body></html>
