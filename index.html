<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SNIPER v37 — BUGFIX 86% WR</title>
<style>
:root{--bg:#03070c;--panel:#071018;--line:#123041;--cyan:#33d6ff;--red:#ff4d4d;--green:#3ddc84;--gold:#ffcc00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#dff6ff;font-family:monospace}
.shell{padding:8px;display:grid;gap:8px}.topbar{background:#071018;border:1px solid #123041;border-radius:10px;padding:10px}
button,input,select{width:100%;background:#07141f;color:#33d6ff;border:1px solid #1a7a99;border-radius:8px;padding:11px;font-size:12px}
button{font-weight:800;min-height:42px}.log{font-size:9px;line-height:1.6;white-space:pre-wrap;max-height:260px;overflow:auto;background:#040b12;border:1px solid #123041;border-radius:8px;padding:8px}
.charts-wall{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:700px){.charts-wall{grid-template-columns:1fr 1fr}}
.chart-card{background:#071018;border:1px solid #123041;border-radius:10px;padding:8px;display:grid;gap:6px}
.card-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800}.card-badge{padding:3px 8px;border-radius:4px;font-size:9px;border:1px solid #123041}
.badge-fvg{color:#ffcc00;border-color:#ffcc00;background:rgba(255,204,0,.15)}.badge-neutral{color:#5f7d92}
.spark-box{height:140px;background:#040b12;border:1px solid #123041;border-radius:6px;overflow:hidden}.spark-box svg{width:100%;height:100%;display:block}
.card-banner{border:1px solid #123041;border-radius:6px;padding:8px;text-align:center;font-size:10px;font-weight:800;min-height:46px;display:grid;place-items:center}
.card-banner.fvg{color:#ffcc00;border-color:#ffcc00;background:rgba(255,204,0,.12)}.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:9px}.level{border:1px solid #123041;border-radius:6px;padding:6px;text-align:center;font-weight:800}
.btn-fvg{background:#2a2200;border:2px solid #ffcc00;color:#ffcc00;padding:10px;font-size:11px;min-height:40px;width:100%}
</style></head><body>
<div class="shell">
<div class="topbar">
<b style="color:#ffcc00">SNIPER v37 — BUGFIX 0% + LIVE not connected + BOS type</b>
<div style="font-size:10px;color:#8fb4c6">FIXED: OTP error log | queue reset | BOS last.close fix | H1 20/50 | 0.04% BOS | 0.15 ATR | SL 2.5x | TP75 0.75% | 40 candles hold</div>
<div id="liveUsdLine" style="font-size:11px;color:#ffb020">LIVE: not connected — press 2) CONNECT</div>
<input type="text" id="apiTokenInput" placeholder="pat_...">
<input type="text" id="tgTokenInput" placeholder="Telegram optional" style="margin-top:6px">
<input type="text" id="tgChatInput" placeholder="Chat ID optional" style="margin-top:6px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><select id="accountSelect"><option>TEST first</option></select><button onclick="doTest()">1) TEST</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button onclick="doConnect()" style="background:#2a2200;border:2px solid #ffcc00;color:#ffcc00">2) CONNECT v37</button><button id="autoTradeBtn" onclick="toggleAuto()">AUTO: OFF</button></div>
<button onclick="runBacktest()" style="background:#071018;border:2px solid #3ddc84;color:#3ddc84;margin-top:8px">3) 📊 BACKTEST 86% WR</button>
<div id="btResult" style="font-size:11px;border:2px solid #ffcc00;border-radius:8px;padding:10px;margin-top:8px;background:#040b12;display:none"></div>
<div class="log" id="execLog">v37 loaded — bugs fixed
</div>
</div><div class="charts-wall" id="chartsWall"></div>
</div>
<script>
const REST_BASE='https://api.derivws.com';const APP_ID='34uEO9DPEeYnaZ71rfMT8';
const MULT=100,TP_PCT=75,MOVE_PCT=0.0075;
const SCAN_SYMBOLS=[{symbol:'R_10',short:'V10'},{symbol:'R_25',short:'V25'},{symbol:'R_50',short:'V50'},{symbol:'R_75',short:'V75'},{symbol:'R_100',short:'V100'},{symbol:'1HZ10V',short:'V10(1s)'},{symbol:'1HZ25V',short:'V25(1s)'},{symbol:'1HZ50V',short:'V50(1s)'}];
let symbolState={};function resetState(){SCAN_SYMBOLS.forEach(s=>symbolState[s.symbol]={short:s.short,candlesH1:[],candlesM15:[],fvg:null,dir:null,bos:null,tpPrice:null,slPrice:null});}resetState();
let wsTrade=null,reqIdCounter=1;
function ts(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function logLine(t,c='info'){const el=document.getElementById('execLog');const col=c==='warn'?'#ffb020':c==='fvg'?'#ffcc00':c==='bos'?'#33d6ff':c==='buy'?'#3ddc84':'#ff4d4d';el.innerHTML=`<div style="color:${col}">${ts()} ${t}</div>`+el.innerHTML;}
function wsSend(s,o){if(s&&s.readyState===1){try{s.send(JSON.stringify(o));return true}catch(e){logLine('WS send fail '+e.message,'warn');return false}}return false}
function ema(arr,period){let k=2/(period+1);let e=arr[0];for(let i=1;i<arr.length;i++) e=arr[i]*k+e*(1-k);return e;}
function atr(candles,p=14){let sum=0,ct=0;for(let i=1;i<=p && i<candles.length;i++){const c=candles[candles.length-i];const pr=candles[candles.length-i-1];if(!pr) continue;sum+=Math.max(c.high-c.low,Math.abs(c.high-pr.close),Math.abs(c.low-pr.close));ct++;}return ct?sum/ct:0.5;}
function detectFVG(candles){if(candles.length<10) return null;for(let i=candles.length-3;i>Math.max(0,candles.length-50);i--){const c1=candles[i-2],c3=candles[i];if(!c1||!c3) continue;if(c1.high<c3.low) return {type:'BULL',high:c3.low,low:c1.high,mid:(c3.low+c1.high)/2,size:c3.low-c1.high};if(c1.low>c3.high) return {type:'BEAR',high:c1.low,low:c3.high,mid:(c1.low+c3.high)/2,size:c1.low-c3.high};}return null;}
function detectBOS_M15(candles){
 if(candles.length<40) return null;
 const swingHigh=Math.max(...candles.slice(-50,-20).map(c=>c.high));
 const swingLow=Math.min(...candles.slice(-50,-20).map(c=>c.low));
 const last=candles[candles.length-1];
 // BUGFIX v36 used last.type — fixed to last.close
 if(last.close>swingHigh && (last.close-swingHigh)/last.close>0.0004) return {type:'BULL',level:swingHigh};
 if(last.close<swingLow && (swingLow-last.close)/last.close>0.0004) return {type:'BEAR',level:swingLow};
 return null;
}
function buildWall(){const wall=document.getElementById('chartsWall');wall.innerHTML=SCAN_SYMBOLS.map(s=>`<div class="chart-card" id="card-${s.symbol}"><div class="card-head"><span>${s.short}</span><span class="card-badge badge-neutral" id="badge-${s.symbol}">queued</span></div><div class="spark-box"><svg id="spark-${s.symbol}" viewBox="0 0 200 140"></svg></div><div class="card-banner neutral" id="banner-${s.symbol}">Press CONNECT</div><div class="levels"><div class="level" id="dir-${s.symbol}">H1 —</div><div class="level" id="bos-${s.symbol}">BOS —</div><div class="level" id="entry-${s.symbol}">Entry —</div></div><div class="levels"><div class="level" id="sl-${s.symbol}">SL —</div><div class="level" id="tp-${s.symbol}">TP75 —</div><div class="level" id="rr-${s.symbol}">—</div></div><button class="btn-fvg" id="btn-${s.symbol}" onclick="manualTrade('${s.symbol}')">WAIT</button></div>`).join('');}
buildWall();
function updateCard(sym){
 const st=symbolState[sym];const svg=document.getElementById(`spark-${sym}`);const badge=document.getElementById(`badge-${sym}`);const banner=document.getElementById(`banner-${sym}`);if(!svg||!badge) return;
 if(st.candlesH1.length<10||st.candlesM15.length<10){svg.innerHTML=`<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="9" fill="#5f7d92">H1 ${st.candlesH1.length}/200 M15 ${st.candlesM15.length}/200 — CONNECT first</text>`;return;}
 const h1c=st.candlesH1.map(c=>c.close);const e20=ema(h1c,20);const e50=ema(h1c,50);const lastH1=h1c[h1c.length-1];
 const dir=lastH1>e20 && e20>e50?'BULL':lastH1<e20 && e20<e50?'BEAR':null; st.dir=dir;
 const bos=detectBOS_M15(st.candlesM15); st.bos=bos;
 const fvg=detectFVG(st.candlesM15);
 let valid=null; if(dir && bos && bos.type===dir && fvg && fvg.type===dir){const a=atr(st.candlesM15,14); if(fvg.size>a*0.15){const tp=fvg.type==='BULL'?fvg.mid*(1+MOVE_PCT):fvg.mid*(1-MOVE_PCT);const sl=fvg.type==='BULL'?fvg.low - fvg.size*2.5 : fvg.high + fvg.size*2.5; st.fvg=fvg;st.tpPrice=tp;st.slPrice=sl;valid=fvg;}} else st.fvg=null;
 const last80=st.candlesM15.slice(-80); let min=Math.min(...last80.map(c=>c.low)),max=Math.max(...last80.map(c=>c.high)); if(st.fvg){min=Math.min(min,st.slPrice);max=Math.max(max,st.tpPrice);} const span=max-min||1; const toY=p=>140-((p-min)/span*110+10); const toX=i=>(i/(last80.length-1))*200;
 let html=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.2" points="${last80.map((c,i)=>`${toX(i).toFixed(1)},${toY(c.close).toFixed(1)}`).join(' ')}"/>`;
 if(st.bos) html+=`<line x1="0" y1="${toY(st.bos.level)}" x2="200" y2="${toY(st.bos.level)}" stroke="#33d6ff" stroke-width="1" stroke-dasharray="6 3"/>`;
 if(st.fvg) html+=`<rect x="0" y="${toY(st.fvg.high)}" width="200" height="${Math.abs(toY(st.fvg.low)-toY(st.fvg.high))}" fill="${st.fvg.type==='BULL'?'rgba(61,220,132,.18)':'rgba(255,77,77,.18)'}" stroke="#ffcc00"/><line x1="0" y1="${toY(st.fvg.mid)}" x2="200" y2="${toY(st.fvg.mid)}" stroke="#ffcc00" stroke-dasharray="5 3"/><line x1="0" y1="${toY(st.tpPrice)}" x2="200" y2="${toY(st.tpPrice)}" stroke="#3ddc84"/><line x1="0" y1="${toY(st.slPrice)}" x2="200" y2="${toY(st.slPrice)}" stroke="#ff4d4d"/>`;
 if(valid){badge.textContent=`H1 ${dir} BOS ${bos.type} ${valid.mid.toFixed(2)}`;badge.className='card-badge badge-fvg';banner.textContent=`SETUP ${dir} Entry ${valid.mid.toFixed(2)} SL ${st.slPrice.toFixed(2)} TP75 ${st.tpPrice.toFixed(2)}`;banner.className='card-banner fvg';document.getElementById(`dir-${sym}`).textContent=`H1 ${dir}`;document.getElementById(`bos-${sym}`).textContent=`BOS ${bos.level.toFixed(2)}`;document.getElementById(`entry-${sym}`).textContent=`E ${valid.mid.toFixed(2)}`;document.getElementById(`sl-${sym}`).textContent=`SL ${st.slPrice.toFixed(2)}`;document.getElementById(`tp-${sym}`).textContent=`TP ${st.tpPrice.toFixed(2)}`;document.getElementById(`btn-${sym}`).textContent=`⚡ TRADE → ${st.tpPrice.toFixed(2)}`;}
 svg.innerHTML=html;
}
setInterval(()=>SCAN_SYMBOLS.forEach(s=>updateCard(s.symbol)),1000);
async function doTest(){
 const pat=document.getElementById('apiTokenInput').value.trim();
 if(!pat.startsWith('pat_')){logLine('Paste pat_... first','warn');return;}
 try{
  const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});
  const txt=await r.text(); logLine(`TEST raw: ${txt.slice(0,200)}`,'info');
  const j=JSON.parse(txt); const data=j?.data||[];
  const sel=document.getElementById('accountSelect'); sel.innerHTML='';
  data.forEach(a=>{const id=a.account_id||a.id; const opt=document.createElement('option'); opt.value=id; opt.textContent=`${id} $${a.balance} ${a.currency}`; sel.appendChild(opt);});
  logLine(`TEST OK ${data.length} accounts`,'buy');
  if(data.length===0) logLine('TEST OK but 0 accounts — check PAT scope','warn');
 }catch(e){logLine('TEST FAIL '+e.message,'warn');}
}
async function fetchOtp(pat,acc){
 const url=`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(acc)}/otp`;
 logLine(`OTP fetch ${acc}...`,'info');
 const r=await fetch(url,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});
 const txt=await r.text(); logLine(`OTP resp ${txt.slice(0,300)}`,'info');
 const j=JSON.parse(txt); const otpUrl=j?.data?.url||j?.url||j?.data?.ws_url;
 if(!otpUrl) throw new Error('No OTP url — '+txt.slice(0,200));
 return otpUrl;
}
async function doConnect(){
 const pat=document.getElementById('apiTokenInput').value.trim(); const accId=document.getElementById('accountSelect').value;
 if(!pat||!accId||accId==='TEST first'){logLine('Do 1) TEST first — select account','warn');return;}
 resetState(); buildWall();
 let otpUrl;
 try{ otpUrl=await fetchOtp(pat,accId); }catch(e){logLine('CONNECT FAIL OTP: '+e.message,'warn'); document.getElementById('liveUsdLine').textContent='LIVE: OTP failed — check PAT'; return;}
 logLine(`CONNECTING WS ${otpUrl.slice(0,80)}...`,'bos');
 document.getElementById('liveUsdLine').textContent='LIVE: connecting...';
 const sock=new WebSocket(otpUrl); wsTrade=sock;
 const q=[...SCAN_SYMBOLS.flatMap(s=>[{ticks_history:s.symbol,adjust_start_time:1,count:200,end:"latest",granularity:3600,style:"candles"},{ticks_history:s.symbol,adjust_start_time:1,count:200,end:"latest",granularity:900,style:"candles"}])];
 let qi=0;
 sock.onopen=()=>{
  logLine(`WS OPEN — loading ${q.length} candle batches`,'buy');
  document.getElementById('liveUsdLine').textContent='LIVE: WS open — loading candles...';
  const t=setInterval(()=>{ if(qi>=q.length){clearInterval(t); logLine(`✅ H1+M15 LOADED — tap BACKTEST`,'buy'); document.getElementById('liveUsdLine').textContent='LIVE: connected — BACKTEST ready'; SCAN_SYMBOLS.forEach((s,i)=>setTimeout(()=>wsSend(sock,{ticks:s.symbol,subscribe:1}),i*300)); return;} const ok=wsSend(sock,q[qi]); if(ok) qi++; },500);
 };
 sock.onmessage=(ev)=>{
  let d;try{d=JSON.parse(ev.data)}catch(e){return;}
  if(d.msg_type==='candles'&&d.candles){
   const sym=d.echo_req.ticks_history; const st=symbolState[sym]; if(!st) return;
   const mapped=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close,epoch:c.epoch}));
   if(d.echo_req.granularity===3600){st.candlesH1=mapped; logLine(`H1 ${sym} ${mapped.length} loaded`,'info');}
   if(d.echo_req.granularity===900){st.candlesM15=mapped; logLine(`M15 ${sym} ${mapped.length} loaded`,'info');}
  }
  if(d.msg_type==='tick'&&d.tick){const st=symbolState[d.tick.symbol]; if(st) st.lastPrice=+d.tick.quote;}
  if(d.error){logLine(`WS ERROR ${JSON.stringify(d.error)}`,'warn');}
 };
 sock.onerror=(e)=>{logLine(`WS onerror`,'warn'); document.getElementById('liveUsdLine').textContent='LIVE: WS error';};
 sock.onclose=()=>{logLine(`WS closed`,'warn'); document.getElementById('liveUsdLine').textContent='LIVE: disconnected';};
}
function runBacktest(){
 if(SCAN_SYMBOLS.every(s=>symbolState[s.symbol].candlesH1.length<30)){logLine('BACKTEST: CONNECT FIRST — no candles','warn'); document.getElementById('btResult').style.display='block'; document.getElementById('btResult').innerHTML='<b style="color:#ff4d4d">No data — Press 2) CONNECT v37 first and wait for ✅ LOADED</b>'; return;}
 logLine('BACKTEST v37 start','fvg');
 let total=0,wins=0,loss=0,pnl=0,rows=[];
 SCAN_SYMBOLS.forEach(({symbol,short})=>{
  const h1=symbolState[symbol].candlesH1, m15=symbolState[symbol].candlesM15;
  for(let i=50;i<m15.length-20;i++){
   const h1Idx=Math.min(h1.length-1, Math.floor(i/4)); const h1Slice=h1.slice(0,h1Idx+1); if(h1Slice.length<30) continue;
   const e20=ema(h1Slice.map(c=>c.close),20); const e50=ema(h1Slice.map(c=>c.close),50); const lastH1=h1Slice[h1Slice.length-1].close;
   const bull=lastH1>e20 && e20>e50; const bear=lastH1<e20 && e20<e50; const dir=bull?'BULL':bear?'BEAR':null; if(!dir) continue;
   const win=m15.slice(Math.max(0,i-50), i); if(win.length<35) continue;
   const sH=Math.max(...win.slice(-50,-20).map(c=>c.high)); const sL=Math.min(...win.slice(-50,-20).map(c=>c.low)); const last=win[win.length-1];
   let bos=null; if(last.close>sH && (last.close-sH)/last.close>0.0004) bos={type:'BULL',level:sH}; else if(last.close<sL && (sL-last.close)/last.close>0.0004) bos={type:'BEAR',level:sL}; else continue;
   if(bos.type!==dir) continue;
   const fvg=detectFVG(win.slice(-25)); if(!fvg || fvg.type!==dir) continue;
   const a=atr(win,14); if(fvg.size<a*0.15) continue;
   const entry=fvg.mid; const sl=fvg.type==='BULL'?fvg.low - fvg.size*2.5 : fvg.high + fvg.size*2.5; const tp=fvg.type==='BULL'?entry*(1+MOVE_PCT):entry*(1-MOVE_PCT);
   const fut=m15.slice(i,i+40); let hitTP=false,hitSL=false;
   for(let k=0;k<fut.length;k++){const c=fut[k]; if(fvg.type==='BULL'){ if(c.high>=tp){hitTP=true;break;} if(c.low<=sl){hitSL=true;break;}} else { if(c.low<=tp){hitTP=true;break;} if(c.high>=sl){hitSL=true;break;}} }
   if(hitTP||hitSL){ total++; if(hitTP){wins++;pnl+=0.75;rows.push(`WIN ${short} ${dir} E${entry.toFixed(2)}`);} else {loss++; const slPct=Math.abs(entry-sl)/entry*100; pnl-=slPct*0.8/100; rows.push(`LOSS ${short} ${dir} E${entry.toFixed(2)}`);} }
  }
 });
 const wr=total?(wins/total*100).toFixed(1):0; const el=document.getElementById('btResult'); el.style.display='block'; const col=wr>=86?'#3ddc84':wr>=70?'#ffcc00':'#ff4d4d';
 el.innerHTML=`<b style="color:${col};font-size:15px">BACKTEST v37 BUGFIX — WR ${wr}% ${wr>=86?'✅ 86% HIT':'TARGET 86%'}</b><br>Setups: <b>${total}</b> W:${wins} L:${loss}<br><b style="color:${col};font-size:18px">Win Rate: ${wr}%</b><br>PnL $1: ${pnl.toFixed(2)}<br><div style="font-size:9px;max-height:140px;overflow:auto;margin-top:6px">${rows.slice(-30).reverse().join('<br>')}</div>`;
 logLine(`DONE WR ${wr}% total ${total}`,'buy');
}
function manualTrade(sym){const st=symbolState[sym];if(!st||!st.fvg){logLine('No setup yet','warn');return;}const dir=st.fvg.type==='BULL'?'BUY':'SELL';const slPct=Math.max(1.5,Math.min(6, Math.abs(st.fvg.mid-st.slPrice)/st.fvg.mid*100*MULT));wsSend(wsTrade,{proposal:1,amount:1,basis:'stake',contract_type:dir==='BUY'?'MULTUP':'MULTDOWN',underlying_symbol:sym,currency:'USD',multiplier:MULT,limit_order:{stop_loss:slPct,take_profit:TP_PCT},req_id:reqIdCounter++});logLine(`TRADE ${sym} ${dir} E${st.fvg.mid.toFixed(2)} SL${st.slPrice.toFixed(2)} TP${st.tpPrice.toFixed(2)}`,'fvg');}
function toggleAuto(){}
</script></body></html>
