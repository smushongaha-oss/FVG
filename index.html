<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SNIPER v45 TP LINE</title>
<style>
:root{--bg:#02060a;--panel:#08111a;--line:#143245;--cyan:#33d6ff;--green:#3ddc84;--gold:#ffcc00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#dff6ff;font-family:monospace}
.shell{padding:10px;max-width:900px;margin:0 auto;display:grid;gap:10px}
.topbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,button{width:100%;background:#0a1a27;color:var(--cyan);border:1px solid #1c5a75;border-radius:10px;padding:12px}
button{font-weight:800;min-height:44px}
.live{font-size:11px;padding:8px;border-radius:8px;background:#040b12;border:1px solid var(--line);display:flex;justify-content:space-between}
.progress{height:4px;background:#0a1a27;border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0%;transition:.3s}
.log{font-size:9px;max-height:250px;overflow:auto;background:#040b12;border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap}
.charts-wall{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.card.setup{border-color:var(--gold);box-shadow:0 0 20px rgba(255,204,0,.35)}
.spark{height:170px;background:#040b12;border:1px solid var(--line);border-radius:8px;overflow:hidden}.spark svg{width:100%;height:100%;display:block}
.banner{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:10px;font-weight:700;min-height:44px;display:grid;place-items:center}
.banner.gold{background:rgba(255,204,0,.1);color:var(--gold);border-color:var(--gold)}.banner.orange{background:rgba(255,170,0,.1);color:#ffaa00;border-color:#ffaa00}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;font-size:9px}.lv{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;background:#040b12}
.btn-trade{background:#201a00;border:2px solid var(--gold);color:var(--gold)}
.badge{padding:3px 8px;border-radius:6px;font-size:9px;border:1px solid var(--line)}.badge-orange{color:#ffaa00;border-color:#ffaa00;background:rgba(255,170,0,.15)}
.result{border:2px solid var(--gold);border-radius:10px;padding:12px;background:#0a0a05;display:none}
</style></head><body><div class="shell"><div class="topbar">
<h1>SNIPER v45 — TP LINE FIXED</h1>
<div class="live"><span id="liveUsdLine">LIVE: idle</span><b id="livePct">0%</b></div><div class="progress"><i id="progBar"></i></div>
<input id="apiTokenInput" placeholder="pat_..."><div class="row"><select id="accountSelect"><option>1) TEST</option></select><button onclick="doTest()" id="btnTest">1) TEST</button></div>
<div class="row"><button onclick="doConnect()" id="btnConn">2) CONNECT v45</button><button id="autoTradeBtn" onclick="toggleAuto()">AUTO: OFF</button></div>
<button onclick="runBacktest()">3) BACKTEST</button><div class="result" id="btResult"></div><div class="log" id="execLog">v45 TP line fix loaded</div></div><div class="charts-wall" id="chartsWall"></div></div>
<script>
const REST_BASE='https://api.derivws.com',APP_ID='34uEO9DPEeYnaZ71rfMT8',MULT=100,TP_PCT=40,MOVE_PCT=0.004;
const SCAN_SYMBOLS=[{symbol:'R_10',short:'V10'},{symbol:'R_25',short:'V25'},{symbol:'1HZ10V',short:'V10(1s)'},{symbol:'1HZ25V',short:'V25(1s)'},{symbol:'R_100',short:'V100'},{symbol:'1HZ100V',short:'V100(1s)'}];
let S={};SCAN_SYMBOLS.forEach(x=>S[x.symbol]={short:x.short,h1:[],m15:[],fvg:null,bos:null,tp:null,sl:null,lastTrade:0,lastPrice:null});
let ws=null,reqId=1,auto=false;const $=id=>document.getElementById(id);
function log(t,c='green'){const col=c==='warn'?'#ffb020':c==='gold'?'#ffcc00':'#3ddc84';$('execLog').innerHTML=`<div style="color:${col}">${new Date().toLocaleTimeString()} ${t}</div>`+$('execLog').innerHTML;}
function setLive(t,p=0){$('liveUsdLine').textContent=t;$('livePct').textContent=p?Math.round(p)+'%':'';$('progBar').style.width=p+'%';}
function wsSend(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function savePat(){localStorage.setItem('deriv_pat',$('apiTokenInput').value.trim());}
function loadPat(){const v=localStorage.getItem('deriv_pat');if(v) $('apiTokenInput').value=v;}loadPat();
function ema(a,p){let k=2/(p+1),e=a[0];for(let i=1;i<a.length;i++) e=a[i]*k+e*(1-k);return e;}
function detectFVG(cs){for(let i=cs.length-3;i>cs.length-30&&i>0;i--){const c1=cs[i-2],c3=cs[i];if(!c1||!c3)continue;if(c1.high<c3.low) return {type:'BULL',high:c3.low,low:c1.high,mid:(c3.low+c1.high)/2,size:c3.low-c1.high};if(c1.low>c3.high) return {type:'BEAR',high:c1.low,low:c3.high,mid:(c1.low+c3.high)/2,size:c1.low-c3.high};}return null;}
function detectBOS(cs){if(cs.length<40) return null;const sH=Math.max(...cs.slice(-50,-15).map(c=>c.high)),sL=Math.min(...cs.slice(-50,-15).map(c=>c.low)),last=cs[cs.length-1],prev=cs[cs.length-2];if(last.close>sH&&prev.close<=sH) return {type:'BULL',level:sH};if(last.close<sL&&prev.close>=sL) return {type:'BEAR',level:sL};return null;}
function build(){const w=$('chartsWall');w.innerHTML=SCAN_SYMBOLS.map(s=>`<div class="card" id="card-${s.symbol}"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800"><span>${s.short}</span><span class="badge" id="badge-${s.symbol}">idle</span></div><div class="spark"><svg id="spark-${s.symbol}" viewBox="0 0 200 170"></svg></div><div class="banner" id="banner-${s.symbol}">CONNECT first</div><div class="levels"><div class="lv" id="dir-${s.symbol}">H1 —</div><div class="lv" id="bos-${s.symbol}">BOS —</div><div class="lv" id="entry-${s.symbol}">FVG —</div></div><div class="levels"><div class="lv" id="sl-${s.symbol}">SL —</div><div class="lv" id="tp-${s.symbol}">TP —</div><div class="lv" id="stat-${s.symbol}">—</div></div><button class="btn-trade" id="btn-${s.symbol}" onclick="manualTrade('${s.symbol}')">WAIT</button></div>`).join('');}build();
function update(sym){
 const st=S[sym];const svg=$(`spark-${sym}`);if(!svg) return;
 if(st.m15.length<20){svg.innerHTML=`<text x="50%" y="50%" text-anchor="middle" fill="#5f7d92" font-size="10">M15 ${st.m15.length}/200</text>`;return;}
 const fvg=detectFVG(st.m15);const bos=detectBOS(st.m15);st.fvg=fvg;st.bos=bos;
 // ALWAYS calc TP/SL if FVG exists
 if(fvg){
   st.tp=fvg.type==='BULL'?fvg.mid*(1+MOVE_PCT):fvg.mid*(1-MOVE_PCT);
   st.sl=fvg.type==='BULL'?fvg.low-fvg.size*0.9:fvg.high+fvg.size*0.9;
 }
 const last=st.m15.slice(-80);let mn=Math.min(...last.map(c=>c.low)),mx=Math.max(...last.map(c=>c.high));
 if(fvg){mn=Math.min(mn,fvg.low,st.sl||fvg.low);mx=Math.max(mx,fvg.high,st.tp||fvg.high);}
 if(bos){mn=Math.min(mn,bos.level);mx=Math.max(mx,bos.level);}
 const sp=mx-mn||1,toY=p=>170-((p-mn)/sp*135+10),toX=i=>(i/79)*200;
 let h=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.3" points="${last.map((c,i)=>`${toX(i)},${toY(c.close)}`).join(' ')}"/>`;
 if(bos) h+=`<line x1="0" y1="${toY(bos.level)}" x2="200" y2="${toY(bos.level)}" stroke="#33d6ff" stroke-dasharray="6 3"/><text x="4" y="${toY(bos.level)-5}" font-size="7" fill="#33d6ff">BOS ${bos.level.toFixed(1)}</text>`;
 if(fvg&&st.tp&&st.sl){
   const yH=toY(fvg.high),yL=toY(fvg.low);
   h+=`<rect x="0" y="${Math.min(yH,yL)}" width="200" height="${Math.max(10,Math.abs(yL-yH))}" fill="${fvg.type==='BULL'?'rgba(61,220,132,.3)':'rgba(255,77,77,.3)'}" stroke="#ffcc00" stroke-width="1.2"/>`;
   h+=`<line x1="0" y1="${toY(fvg.mid)}" x2="200" y2="${toY(fvg.mid)}" stroke="#ffcc00" stroke-dasharray="5 3" stroke-width="1.2"/>`;
   h+=`<line x1="0" y1="${toY(st.tp)}" x2="200" y2="${toY(st.tp)}" stroke="#3ddc84" stroke-width="2"/><text x="2" y="${toY(st.tp)-5}" font-size="9" fill="#3ddc84" font-weight="bold">TP ${st.tp.toFixed(2)} +40%</text>`;
   h+=`<line x1="0" y1="${toY(st.sl)}" x2="200" y2="${toY(st.sl)}" stroke="#ff4d4d" stroke-width="1.5"/><text x="2" y="${toY(st.sl)+11}" font-size="8" fill="#ff4d4d">SL ${st.sl.toFixed(2)}</text>`;
 }
 svg.innerHTML=h;
 if(fvg){
   $(`badge-${sym}`).textContent=`FVG ${fvg.type} ${fvg.mid.toFixed(2)}`;$(`badge-${sym}`).className='badge badge-orange';
   $(`banner-${sym}`).textContent=`FVG ${fvg.type} ${fvg.mid.toFixed(2)} → TP ${st.tp.toFixed(2)} (+40%) SL ${st.sl.toFixed(2)}`;
   $(`banner-${sym}`).className='banner orange';
   $(`entry-${sym}`).textContent=`FVG ${fvg.mid.toFixed(2)}`;$(`sl-${sym}`).textContent=`SL ${st.sl.toFixed(2)}`;$(`tp-${sym}`).textContent=`TP ${st.tp.toFixed(2)}`;
   $(`btn-${sym}`).textContent=`⚡ TRADE ${sym} TP ${st.tp.toFixed(1)}`;
   $(`card-${sym}`).className='card setup';
   if(bos) $(`bos-${sym}`).textContent=`BOS ${bos.level.toFixed(1)}`;
 }
}
setInterval(()=>SCAN_SYMBOLS.forEach(s=>update(s.symbol)),600);
async function doTest(){const pat=$('apiTokenInput').value.trim();if(!pat.startsWith('pat_')){log('Paste pat_','warn');return;}savePat();$('btnTest').textContent='TESTING...';try{const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{Authorization:`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());const data=j?.data||[];data.sort((a,b)=>parseFloat(b.balance)-parseFloat(a.balance));const sel=$('accountSelect');sel.innerHTML='';data.forEach(a=>{const o=document.createElement('option');o.value=a.account_id||a.id;o.textContent=`${a.account_id} $${a.balance}`;sel.appendChild(o);});sel.selectedIndex=0;log(`TEST OK ${data.length} ${data[0].account_id} $${data[0].balance}`);setLive(`TEST OK $${data[0].balance}`,100);}catch(e){log('FAIL '+e.message,'warn');}finally{$('btnTest').textContent='1) TEST';}}
async function getOtp(pat,acc){const r=await fetch(`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(acc)}/otp`,{method:'POST',headers:{Authorization:`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());return j?.data?.url||j?.url;}
async function doConnect(){const pat=$('apiTokenInput').value.trim(),acc=$('accountSelect').value;if(!pat||!acc){log('TEST first','warn');return;}savePat();SCAN_SYMBOLS.forEach(s=>{S[s.symbol].h1=[];S[s.symbol].m15=[];});build();$('btnConn').textContent='CONNECTING...';$('btnConn').disabled=true;let otp;try{otp=await getOtp(pat,acc);}catch(e){log('OTP fail','warn');$('btnConn').disabled=false;return;}const wsUrl=otp;ws=new WebSocket(wsUrl);const q=[...SCAN_SYMBOLS.flatMap(s=>[{ticks_history:s.symbol,count:200,end:"latest",granularity:3600,style:"candles"},{ticks_history:s.symbol,count:200,end:"latest",granularity:900,style:"candles"}])];let qi=0;ws.onopen=()=>{log(`WS OPEN ${q.length}`);const t=setInterval(()=>{if(qi>=q.length){clearInterval(t);log('✅ LOADED — TP LINES VISIBLE','gold');setLive('LIVE: TP LINES VISIBLE',100);$('btnConn').textContent='CONNECTED ✅';setTimeout(()=>{$('btnConn').disabled=false;$('btnConn').textContent='2) CONNECT v45';},2000);SCAN_SYMBOLS.forEach((s,i)=>setTimeout(()=>wsSend({ticks:s.symbol,subscribe:1}),i*200));return;}if(wsSend(q[qi])) qi++,setLive(`Loading ${qi}/${q.length}`,30+(qi/q.length*60));},350);};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return;}if(d.msg_type==='candles'&&d.candles){const st=S[d.echo_req.ticks_history];if(!st) return;const m=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close}));if(d.echo_req.granularity===3600) st.h1=m;else st.m15=m;}if(d.msg_type==='tick'){const st=S[d.tick.symbol];if(st) st.lastPrice=+d.tick.quote;}};}
function manualTrade(sym){const st=S[sym];if(!st?.fvg){log('No FVG','warn');return;}const dir=st.fvg.type==='BULL'?'MULTUP':'MULTDOWN';const slPct=Math.max(0.8,Math.min(5,Math.abs(st.fvg.mid-st.sl)/st.fvg.mid*100*MULT));wsSend({proposal:1,amount:1,basis:'stake',contract_type:dir,underlying_symbol:sym,currency:'USD',multiplier:MULT,limit_order:{stop_loss:slPct,take_profit:TP_PCT},req_id:reqId++});log(`TRADE ${sym} E${st.fvg.mid.toFixed(1)} TP${st.tp.toFixed(1)} +40%`,'gold');}
function toggleAuto(){auto=!auto;const b=$('autoTradeBtn');if(auto){b.textContent='AUTO: ON ✅';b.style.background='#002a12';b.style.borderColor='#3ddc84';b.style.color='#3ddc84';log('AUTO ON');setLive('AUTO ON',100);}else{b.textContent='AUTO: OFF';b.style.background='';log('AUTO OFF');}}
function runBacktest(){if(SCAN_SYMBOLS.every(s=>S[s.symbol].m15.length<20)){log('CONNECT first','warn');return;}let total=0,wins=0,pnl=0,rows=[];SCAN_SYMBOLS.forEach(({symbol,short})=>{const m15=S[symbol].m15;for(let i=50;i<m15.length-30;i++){const before=m15.slice(0,i);const fvg=detectFVG(before.slice(-20));if(!fvg)continue;const tp=fvg.mid*(1+(fvg.type==='BULL'?MOVE_PCT:-MOVE_PCT)),sl=fvg.type==='BULL'?fvg.low-fvg.size*0.9:fvg.high+fvg.size*0.9;let retest=-1;for(let k=i;k<Math.min(i+12,m15.length);k++){if(m15[k].low<=fvg.mid&&m15[k].high>=fvg.mid){retest=k;break;}}if(retest==-1)continue;const fut=m15.slice(retest,retest+25);for(let k=0;k<fut.length;k++){if(fvg.type==='BULL'&&fut[k].high>=tp){wins++;total++;pnl+=0.4;rows.push(`WIN ${short} ${fvg.type}`);break;}if(fvg.type==='BEAR'&&fut[k].low<=tp){wins++;total++;pnl+=0.4;rows.push(`WIN ${short} ${fvg.type}`);break;}if(fvg.type==='BULL'&&fut[k].low<=sl||fvg.type==='BEAR'&&fut[k].high>=sl){total++;pnl-=0.32;rows.push(`LOSS ${short}`);break;}}}});const wr=total?((wins/total)*100).toFixed(1):0;const el=$('btResult');el.style.display='block';el.innerHTML=`<b style="color:#3ddc84">WR ${wr}% Setups ${total} W${wins} PnL $${pnl.toFixed(2)}</b><br>${rows.slice(-20).reverse().join('<br>')}`;}
</script></body></html>
