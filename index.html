<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Crash 300 LIVE v55 Fixed</title>
<style>
body{margin:0;background:#0a0a0a;font-family:Arial,sans-serif;color:#fff}
.header{background:#000;padding:12px;text-align:center;font-weight:900;border-bottom:2px solid #d40000}
.live-bar{background:#141414;padding:8px 12px;display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #222}
.dot{width:8px;height:8px;border-radius:50%;background:red;display:inline-block}.dot.on{background:#00ff88;box-shadow:0 0 6px #00ff88}
.chart-wrap{background:#000;padding:8px;height:220px;border-bottom:1px solid #222}.chart-wrap svg{width:100%;height:100%}
.controls{background:#111;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input{background:#1a1a1a;color:#33d6ff;border:1px solid #333;border-radius:6px;padding:10px}
button{background:#d40000;color:#fff;border:none;border-radius:8px;padding:12px;font-weight:800}
.signal{background:#fff;color:#000;border-bottom:1px solid #e5e5e5;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.left{display:grid;gap:2px}.top{font-size:15px;font-weight:900}.top .sell{color:#d40000}.mid{font-size:13px;color:#7a7a7a;font-weight:600}.profit{font-size:20px;font-weight:900;color:#2a7bff}
.log{font-size:10px;color:#888;padding:6px;background:#000;max-height:90px;overflow:auto}
</style></head><body>
<div class="header">CRASH 300 LIVE — FIXED WS</div>
<div class="live-bar"><span><span class="dot" id="dot"></span> <span id="status">IDLE</span></span><span id="price">—</span><span id="count">0 signals</span></div>
<div class="chart-wrap"><svg id="chart" viewBox="0 0 300 180"></svg></div>
<div class="controls"><input id="stake" value="2.60"><button onclick="connect()" id="connBtn">CONNECT</button><button onclick="toggleAuto()" id="autoBtn">AUTO: ON</button></div>
<div class="log" id="log"></div>
<div id="list"></div>
<script>
const APP_ID='34uEO9DPEeYnaZ71rfMT8';
let ws=null,ticks=[],candles=[],auto=true,sigCount=0,lastPrice=0,fvg=null,pingTimer=null;
const $=id=>document.getElementById(id);
function log(t){$('log').innerHTML=`${new Date().toLocaleTimeString()} ${t}<br>`+$('log').innerHTML;}
function setStatus(t,on){$('status').textContent=t;$('dot').className=on?'dot on':'dot';}
function detectFVG(cs){
 for(let i=cs.length-3;i>cs.length-25&&i>0;i--){
  const c1=cs[i-2],c3=cs[i];if(!c1||!c3)continue;
  if(c1.high<c3.low) return {type:'BULL',mid:(c3.low+c1.high)/2,low:c1.high,high:c3.low};
  if(c1.low>c3.high) return {type:'BEAR',mid:(c1.low+c3.high)/2,low:c3.high,high:c1.low};
 }
 return null;
}
function draw(){
 if(candles.length<20){$('chart').innerHTML=`<text x="50%" y="50%" fill="#555" font-size="10" text-anchor="middle">${candles.length}/100 loading...</text>`;return;}
 const last=candles.slice(-80);let mn=Math.min(...last.map(c=>c.low)),mx=Math.max(...last.map(c=>c.high));
 const sp=mx-mn||1,toY=p=>170-((p-mn)/sp*140+10),toX=i=>(i/79)*300;
 let h=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.2" points="${last.map((c,i)=>`${toX(i)},${toY(c.close)}`).join(' ')}"/>`;
 const f=detectFVG(candles);if(f){fvg=f;h+=`<line x1="0" y1="${toY(f.mid)}" x2="300" y2="${toY(f.mid)}" stroke="#ffcc00" stroke-dasharray="3 3"/>`;}
 $('chart').innerHTML=h;
}
function genSignal(type,entry){
 const stake=parseFloat($('stake').value)||2.60;
 const exit=type==='BEAR'?entry-2.469:entry+2.469;
 const profit=(2.469*stake).toFixed(2);
 const label=type==='BEAR'?'sell':'buy';
 const cls=label;
 const html=`<div class="signal"><div class="left"><div class="top">Crash 300 Index, <span class="${cls}">${label} ${stake.toFixed(2)}</span></div><div class="mid">${entry.toFixed(3)} → ${exit.toFixed(3)}</div></div><div class="profit">${profit}</div></div>`;
 $('list').innerHTML=html+$('list').innerHTML;sigCount++;$('count').textContent=sigCount+' signals';
 log(`SIGNAL ${label} ${entry.toFixed(3)}→${exit.toFixed(3)} profit ${profit}`);
}
function connect(){
 if(ws&&ws.readyState===1) ws.close();
 setStatus('CONNECTING...',false);log('Connecting wss://ws.derivws.com app_id '+APP_ID);
 // try primary, fallback to binaryws
 const url=`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`;
 ws=new WebSocket(url);
 let opened=false;
 ws.onopen=()=>{
  opened=true;setStatus('WS OPEN - loading CRASH300',true);log('WS OPEN');
  ws.send(JSON.stringify({ticks_history:'CRASH300',count:100,end:'latest',granularity:60,style:'candles'}));
  // keep alive ping every 25s (Deriv closes idle)
  clearInterval(pingTimer);pingTimer=setInterval(()=>{if(ws.readyState===1) ws.send(JSON.stringify({ping:1}));},25000);
  $('connBtn').textContent='CONNECTED';
 };
 ws.onmessage=e=>{
  const d=JSON.parse(e.data);
  if(d.msg_type==='candles'){candles=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close}));log(`Candles ${candles.length} loaded`);draw();ws.send(JSON.stringify({ticks:'CRASH300',subscribe:1}));setStatus('LIVE: CRASH300 TICKING',true);}
  if(d.msg_type==='tick'){
   lastPrice=+d.tick.quote;$('price').textContent=lastPrice.toFixed(3);
   if(candles.length>0){candles[candles.length-1].close=lastPrice;candles[candles.length-1].high=Math.max(candles[candles.length-1].high,lastPrice);candles[candles.length-1].low=Math.min(candles[candles.length-1].low,lastPrice);draw();}
   if(auto&&fvg){const dist=Math.abs(lastPrice-fvg.mid);if(dist<0.6&&Date.now()-window.lastSig>15000){genSignal(fvg.type,fvg.mid);window.lastSig=Date.now();}}
  }
  if(d.error){log('Deriv error: '+d.error.message);setStatus(d.error.message,false);}
 };
 ws.onclose=(e)=>{
  clearInterval(pingTimer);setStatus(`CLOSED code ${e.code} - tap CONNECT`,false);log(`WS closed code ${e.code} reason ${e.reason||'none'}`);$('connBtn').textContent='CONNECT';
  if(!opened){log('Failed immediately - trying fallback wss://ws.binaryws.com');setTimeout(()=>{ws=new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);ws.onopen=()=>{setStatus('WS OPEN (fallback)',true);ws.send(JSON.stringify({ticks_history:'CRASH300',count:100,end:'latest',granularity:60,style:'candles'}));};ws.onmessage=ws.onmessage;},1500);}
 };
 ws.onerror=()=>{log('WS onerror');setStatus('WS ERROR - tap CONNECT',false);};
}
function toggleAuto(){auto=!auto;$('autoBtn').textContent=auto?'AUTO: ON':'AUTO: OFF';log(auto?'Auto ON':'Auto OFF');}
window.lastSig=0;
// auto connect on load
setTimeout(connect,800);
setInterval(()=>{if(candles.length>0) draw();},1000);
</script></body></html>
