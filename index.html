<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>v31 AUTO ACTIVE SYMBOLS</title>
<style>body{margin:0;background:#03070c;color:#dff6ff;font-family:monospace}.topbar{background:#071018;border:1px solid #123041;border-radius:10px;padding:10px;margin:8px}input,select,button{width:100%;background:#07141f;color:#33d6ff;border:1px solid #1a7a99;border-radius:8px;padding:11px}button{font-weight:800;min-height:42px}.log{font-size:9px;white-space:pre-wrap;max-height:200px;overflow:auto;background:#040b12;border:1px solid #123041;border-radius:8px;padding:8px;margin-top:8px}.card{background:#071018;border:1px solid #123041;border-radius:10px;padding:8px;margin:8px}.badge{padding:3px 8px;border-radius:4px;font-size:10px;border:1px solid #123041}</style></head><body>
<div class="topbar"><b style="color:#3ddc84">SNIPER v31 — AUTO DETECT ACTIVE SYMBOLS</b><div id="liveUsdLine" style="font-size:11px;color:#ffb020">LIVE: not connected</div><input type="text" id="apiTokenInput" placeholder="pat_..."><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><select id="accountSelect"><option>TEST first</option></select><button onclick="window.doTest()">1) TEST</button></div><button onclick="window.doConnect()" style="background:#082d18;border:2px solid #3ddc84;color:#3ddc84;margin-top:8px">2) CONNECT v31 - AUTO DETECT</button><div class="log" id="execLog">v31 loaded - will auto-detect available symbols</div></div><div id="chartsWall"></div>
<script>
const REST_BASE='https://api.derivws.com';const APP_ID='34uEO9DPEeYnaZ71rfMT8';
const WANTED=[
  {want:'CRASH300', alts:['CRASH300','CRASH_300','CRASH300_1','CRASH 300 Index']},
  {want:'CRASH500', alts:['CRASH500','CRASH_500']},
  {want:'CRASH1000', alts:['CRASH1000']},
  {want:'BOOM300', alts:['BOOM300','BOOM_300']},
  {want:'BOOM500', alts:['BOOM500']},
  {want:'BOOM1000', alts:['BOOM1000']},
  {want:'stpRNG', alts:['stpRNG','STPRNG','STEP','STEPINDX']},
  {want:'JD10', alts:['JD10']},{want:'JD25', alts:['JD25']},{want:'JD50', alts:['JD50']},{want:'JD75', alts:['JD75']},{want:'JD100', alts:['JD100']},
  {want:'RB10', alts:['RB10','RB 10','RANGEBREAK10']},{want:'RB100', alts:['RB100','RANGEBREAK100']},
  {want:'R_10', alts:['R_10']},{want:'R_25', alts:['R_25']},{want:'R_100', alts:['R_100']},
];
let symbolState={},requestQueue=[],queueIdx=0,wsTrade=null,currentPat=null,currentAccountId=null,tradePing=null,queueTimer=null,activeSymbols=[];
function ts(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}function logLine(t,c='info'){const el=document.getElementById('execLog');const col=c==='warn'?'#ffb020':c==='buy'?'#3ddc84':'#ff4d9a';el.innerHTML=`<div style="color:${col}">${ts()} ${t}</div>`+el.innerHTML;}
function wsSend(s,o){if(s&&s.readyState===1){try{s.send(JSON.stringify(o));return true}catch(e){return false}}return false}
window.doTest=async()=>{const pat=document.getElementById('apiTokenInput').value.trim();if(!pat.startsWith('pat_')){logLine('pat_ invalid','warn');return;}try{const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=await r.json();const data=j?.data||[];const sel=document.getElementById('accountSelect');sel.innerHTML='';let demo=null;data.forEach(a=>{const id=a.account_id||a.id;const opt=document.createElement('option');opt.value=id;opt.textContent=`${id} $${a.balance}`;sel.appendChild(opt);if(id.startsWith('DOT')&&!demo)demo=id;});if(demo)sel.value=demo;logLine(`TEST OK ${data.length} accounts`,'buy');}catch(e){logLine(e.message,'warn');}};
window.doConnect=async()=>{const pat=document.getElementById('apiTokenInput').value.trim();const sel=document.getElementById('accountSelect');const accId=sel.value;if(!pat||!accId){logLine('TEST first','warn');return;}localStorage.setItem('deriv_token',pat);currentPat=pat;currentAccountId=accId;logLine(`CONNECT ${accId} v31`,'trade');const js=await (await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}})).json();const accs=js?.data||[];let ch=accs.find(a=>(a.account_id||a.id)===accId)||accs[0];const otp=await (await fetch(`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(ch.account_id||ch.id)}/otp`,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}})).json();openSocket(otp?.data?.url||otp?.url,ch);};
function openSocket(url,meta){if(wsTrade)try{wsTrade.close()}catch(e){}const sock=new WebSocket(url);wsTrade=sock;sock.onopen=()=>{document.getElementById('liveUsdLine').innerText=`LIVE: ${meta.account_id||meta.id} $${meta.balance} — FETCHING active_symbols`;logLine(`WS OPEN — requesting active_symbols`,'buy');wsSend(sock,{active_symbols:'brief',product_type:'basic'});wsSend(sock,{balance:1,subscribe:1});};sock.onmessage=(ev)=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}if(d.msg_type==='active_symbols'){activeSymbols=d.active_symbols||[];logLine(`active_symbols got ${activeSymbols.length}`,'buy');const availableMap={};activeSymbols.forEach(a=>{availableMap[a.symbol]=a;});let found=[];WANTED.forEach(w=>{let real=null;for(let alt of w.alts){if(availableMap[alt]){real=alt;break;}}if(real){found.push({symbol:real,short:w.want});symbolState[real]={short:w.want,lastPrice:null,candles:[]};logLine(`✅ ${w.want} FOUND as ${real}`,'buy');}else{logLine(`⚠️ ${w.want} NOT FOUND — will skip (account restriction)`,'warn');}});buildCards(found);requestQueue=[];found.forEach(s=>{requestQueue.push({ticks_history:s.symbol,count:200,end:"latest",granularity:3600,style:"candles"});requestQueue.push({ticks_history:s.symbol,count:200,end:"latest",granularity:900,style:"candles"});});queueIdx=0;queueTimer=setInterval(()=>{if(queueIdx>=requestQueue.length){clearInterval(queueTimer);logLine(`✅ All ${requestQueue.length} candles loaded`,'buy');found.forEach(f=>{wsSend(sock,{ticks:f.symbol,subscribe:1});});return;}wsSend(sock,requestQueue[queueIdx]);queueIdx++;},900);return;}if(d.msg_type==='tick'&&d.tick){const sym=d.tick.symbol;if(symbolState[sym]){symbolState[sym].lastPrice=+d.tick.quote;const card=document.getElementById(`price-${sym}`);if(card)card.textContent=(+d.tick.quote).toFixed(3);}}if(d.msg_type==='candles'&&Array.isArray(d.candles)){const sym=d.echo_req.ticks_history;if(symbolState[sym]){const txt=document.getElementById(`candle-${sym}`);if(txt)txt.textContent=`H1 ${d.candles.length} candles loaded @ ${d.candles[d.candles.length-1].close}`;}}if(d.error){if(d.error.code!=='AlreadySubscribed')logLine(`❌ ${d.error.code} ${d.error.message}`,'warn');}};sock.onclose=()=>{logLine('closed - reconnect 4s','warn');setTimeout(()=>{if(currentPat)window.doConnect()},4000);};}function buildCards(list){const wall=document.getElementById('chartsWall');wall.innerHTML=list.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${s.short}</b><span class="badge" style="color:#3ddc84">${s.symbol}</span><span id="price-${s.symbol}">—</span></div><div id="candle-${s.symbol}" style="font-size:10px;color:#5f7d92">loading...</div></div>`).join('');}try{const t=localStorage.getItem('deriv_token');if(t)document.getElementById('apiTokenInput').value=t;}catch(e){}
</script></body></html>
