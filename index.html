<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SNIPER v48 DUAL</title>
<style>
:root{--bg:#02060a;--panel:#08111a;--line:#143245;--cyan:#33d6ff;--green:#3ddc84;--gold:#ffcc00;--red:#ff4d4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#dff6ff;font-family:monospace}
.shell{padding:10px;max-width:1200px;margin:0 auto;display:grid;gap:10px}
.topbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select,button{width:100%;background:#0a1a27;color:var(--cyan);border:1px solid #1c5a75;border-radius:10px;padding:11px;font-size:11px}
button{font-weight:800;min-height:42px}
.live{font-size:11px;padding:8px;border-radius:8px;background:#040b12;border:1px solid var(--line);display:flex;justify-content:space-between}
.progress{height:4px;background:#0a1a27;border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0%;transition:.3s}
.log{font-size:9px;max-height:180px;overflow:auto;background:#040b12;border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap}
.charts-wall{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(min-width:900px){.charts-wall{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px}.card.setup{border-color:var(--gold);box-shadow:0 0 12px rgba(255,204,0,.3)}
.spark{height:115px;background:#040b12;border:1px solid var(--line);border-radius:6px;overflow:hidden}.spark svg{width:100%;height:100%;display:block}
.banner{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:8px;font-weight:700;min-height:34px;display:grid;place-items:center}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:8px}.lv{border:1px solid var(--line);border-radius:6px;padding:5px;text-align:center;background:#040b12}
.btn-trade{background:#201a00;border:2px solid var(--gold);color:var(--gold);font-size:9px;min-height:34px}
.badge{padding:2px 6px;border-radius:5px;font-size:8px;border:1px solid var(--line)}
.filter{display:flex;gap:5px;flex-wrap:wrap}.filter button{width:auto;padding:6px 10px;font-size:9px}
.mode{padding:6px 10px;border-radius:8px;font-size:10px;font-weight:800;text-align:center}.mode-cr{background:rgba(255,204,0,.15);color:var(--gold);border:1px solid var(--gold)}.mode-dot{background:rgba(51,214,255,.12);color:var(--cyan);border:1px solid var(--cyan)}
</style></head><body><div class="shell"><div class="topbar">
<h1>SNIPER v48 — DUAL MODE • CHOOSE ACCOUNT EACH TIME</h1>
<div class="row"><div class="mode" id="modeBadge">SELECT ACCOUNT</div><div style="font-size:9px;color:#7aa7bc" id="modeHint">TEST → Pick CR for V10/V25 or DOT for FOREX</div><div class="filter"><button onclick="setFilter('auto')">AUTO</button><button onclick="setFilter('all')">ALL</button><button onclick="setFilter('vol')">VOL</button><button onclick="setFilter('crash')">CRASH/BOOM</button><button onclick="setFilter('forex')">FOREX</button><button onclick="setFilter('setup')">SETUPS</button></div></div>
<div class="live"><span id="liveUsdLine">LIVE: idle</span><b id="livePct">0%</b><span id="countLine">0 symbols</span></div><div class="progress"><i id="progBar"></i></div>
<input id="apiTokenInput" placeholder="pat_... paste token"><div class="row"><select id="accountSelect"><option>1) Press TEST</option></select><button onclick="doTest()" id="btnTest">1) TEST</button><button onclick="doConnect()" id="btnConn">2) CONNECT</button></div>
<div class="row"><button id="autoTradeBtn" onclick="toggleAuto()">AUTO: OFF</button><button onclick="runBacktest()">BACKTEST</button><button onclick="clearLogs()">CLEAR</button></div>
<div class="log" id="execLog">v48 DUAL loaded — TEST then choose CR or DOT</div></div><div class="charts-wall" id="chartsWall"></div></div>
<script>
const REST_BASE='https://api.derivws.com',APP_ID='34uEO9DPEeYnaZ71rfMT8',MULT=100,TP_PCT=40,MOVE_PCT=0.004;
const ALL_SYMBOLS=[
 {symbol:'R_10',short:'V10',cat:'vol',need:'CR'}, {symbol:'R_25',short:'V25',cat:'vol',need:'CR'}, {symbol:'R_50',short:'V50',cat:'vol',need:'CR'}, {symbol:'R_75',short:'V75',cat:'vol',need:'CR'}, {symbol:'R_100',short:'V100',cat:'vol',need:'CR'},
 {symbol:'1HZ10V',short:'V10(1s)',cat:'vol',need:'CR'}, {symbol:'1HZ25V',short:'V25(1s)',cat:'vol',need:'CR'}, {symbol:'1HZ50V',short:'V50(1s)',cat:'vol',need:'CR'}, {symbol:'1HZ75V',short:'V75(1s)',cat:'vol',need:'CR'}, {symbol:'1HZ100V',short:'V100(1s)',cat:'vol',need:'CR'},
 {symbol:'BOOM300',short:'BOOM300',cat:'crash',need:'CR'}, {symbol:'BOOM500',short:'BOOM500',cat:'crash',need:'CR'}, {symbol:'BOOM1000',short:'BOOM1000',cat:'crash',need:'CR'},
 {symbol:'CRASH300',short:'CRASH300',cat:'crash',need:'CR'}, {symbol:'CRASH500',short:'CRASH500',cat:'crash',need:'CR'}, {symbol:'CRASH1000',short:'CRASH1000',cat:'crash',need:'CR'},
 {symbol:'JD10',short:'JUMP10',cat:'crash',need:'CR'}, {symbol:'JD25',short:'JUMP25',cat:'crash',need:'CR'}, {symbol:'JD50',short:'JUMP50',cat:'crash',need:'CR'}, {symbol:'JD75',short:'JUMP75',cat:'crash',need:'CR'}, {symbol:'JD100',short:'JUMP100',cat:'crash',need:'CR'},
 {symbol:'ST100',short:'STEP100',cat:'crash',need:'CR'},
 {symbol:'frxEURUSD',short:'EUR/USD',cat:'forex',need:'DOT'}, {symbol:'frxGBPUSD',short:'GBP/USD',cat:'forex',need:'DOT'}, {symbol:'frxUSDJPY',short:'USD/JPY',cat:'forex',need:'DOT'}, {symbol:'frxAUDUSD',short:'AUD/USD',cat:'forex',need:'DOT'}, {symbol:'frxUSDCAD',short:'USD/CAD',cat:'forex',need:'DOT'},
 {symbol:'frxXAUUSD',short:'GOLD',cat:'forex',need:'DOT'}, {symbol:'frxXAGUSD',short:'SILVER',cat:'forex',need:'DOT'}, {symbol:'frxBTCUSD',short:'BTC/USD',cat:'forex',need:'DOT'}, {symbol:'frxETHUSD',short:'ETH/USD',cat:'forex',need:'DOT'}, {symbol:'frxDOTUSD',short:'DOT/USD',cat:'forex',need:'DOT'}
];
let S={},filter='auto',currentAccType='';ALL_SYMBOLS.forEach(x=>S[x.symbol]={...x,h1:[],m15:[],fvg:null,bos:null,tp:null,sl:null,lastTrade:0,lastPrice:null});
let ws=null,reqId=1,auto=false;const $=id=>document.getElementById(id);
function log(t,c='green'){const col=c==='warn'?'#ffb020':c==='gold'?'#ffcc00':c==='red'?'#ff4d4d':'#3ddc84';$('execLog').innerHTML=`<div style="color:${col}">${new Date().toLocaleTimeString()} ${t}</div>`+$('execLog').innerHTML;}
function setLive(t,p=0){$('liveUsdLine').textContent=t;$('livePct').textContent=p?Math.round(p)+'%':'';$('progBar').style.width=p+'%';}
function wsSend(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function savePat(){localStorage.setItem('deriv_pat',$('apiTokenInput').value.trim());}
function loadPat(){const v=localStorage.getItem('deriv_pat');if(v) $('apiTokenInput').value=v;}loadPat();
function detectFVG(cs){for(let i=cs.length-3;i>cs.length-30&&i>0;i--){const c1=cs[i-2],c3=cs[i];if(!c1||!c3)continue;if(c1.high<c3.low) return {type:'BULL',high:c3.low,low:c1.high,mid:(c3.low+c1.high)/2,size:c3.low-c1.high};if(c1.low>c3.high) return {type:'BEAR',high:c1.low,low:c3.high,mid:(c1.low+c3.high)/2,size:c1.low-c3.high};}return null;}
function detectBOS(cs){if(cs.length<40) return null;const sH=Math.max(...cs.slice(-50,-15).map(c=>c.high)),sL=Math.min(...cs.slice(-50,-15).map(c=>c.low)),last=cs[cs.length-1],prev=cs[cs.length-2];if(last.close>sH&&prev.close<=sH) return {type:'BULL',level:sH};if(last.close<sL&&prev.close>=sL) return {type:'BEAR',level:sL};return null;}
function getVisible(){if(filter==='all') return ALL_SYMBOLS;if(filter==='setup') return ALL_SYMBOLS.filter(s=>S[s.symbol].fvg);if(filter==='auto'){if(currentAccType.startsWith('CR')||currentAccType.startsWith('VR')) return ALL_SYMBOLS;if(currentAccType.startsWith('DOT')||currentAccType.startsWith('MF')) return ALL_SYMBOLS.filter(s=>s.need==='DOT');return ALL_SYMBOLS;}return ALL_SYMBOLS.filter(s=>s.cat===filter);}
function setFilter(f){filter=f;log(`Filter ${f} — showing ${getVisible().length} symbols`,'gold');build();updateAll();}
function build(){const list=getVisible();const w=$('chartsWall');w.innerHTML=list.map(s=>`<div class="card" id="card-${s.symbol}"><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:800"><span>${s.short}</span><span class="badge" id="badge-${s.symbol}">idle</span></div><div class="spark"><svg id="spark-${s.symbol}" viewBox="0 0 200 115"></svg></div><div class="banner" id="banner-${s.symbol}">CONNECT</div><div class="levels"><div class="lv" id="bos-${s.symbol}">BOS —</div><div class="lv" id="entry-${s.symbol}">FVG —</div><div class="lv" id="tp-${s.symbol}">TP —</div></div><button class="btn-trade" id="btn-${s.symbol}" onclick="manualTrade('${s.symbol}')">WAIT</button></div>`).join('');$('countLine').textContent=`${list.length} symbols [${filter}]`;}
build();
function update(sym){const st=S[sym];const svg=$(`spark-${sym}`);if(!svg) return;if(st.m15.length<20){svg.innerHTML=`<text x="50%" y="50%" text-anchor="middle" fill="#5f7d92" font-size="10">M15 ${st.m15.length}/200</text>`;return;}const fvg=detectFVG(st.m15),bos=detectBOS(st.m15);st.fvg=fvg;st.bos=bos;if(fvg){st.tp=fvg.type==='BULL'?fvg.mid*(1+MOVE_PCT):fvg.mid*(1-MOVE_PCT);st.sl=fvg.type==='BULL'?fvg.low-fvg.size*0.9:fvg.high+fvg.size*0.9;}const last=st.m15.slice(-80);let mn=Math.min(...last.map(c=>c.low)),mx=Math.max(...last.map(c=>c.high));if(fvg){mn=Math.min(mn,fvg.low,st.sl||fvg.low);mx=Math.max(mx,fvg.high,st.tp||fvg.high);}if(bos){mn=Math.min(mn,bos.level);mx=Math.max(mx,bos.level);}const sp=mx-mn||1,toY=p=>115-((p-mn)/sp*90+5),toX=i=>(i/79)*200;let h=`<polyline fill="none" stroke="#33d6ff" stroke-width="1.1" points="${last.map((c,i)=>`${toX(i)},${toY(c.close)}`).join(' ')}"/>`;if(bos) h+=`<line x1="0" y1="${toY(bos.level)}" x2="200" y2="${toY(bos.level)}" stroke="#33d6ff" stroke-dasharray="4 2"/>`;if(fvg&&st.tp&&st.sl){const yH=toY(fvg.high),yL=toY(fvg.low);h+=`<rect x="0" y="${Math.min(yH,yL)}" width="200" height="${Math.max(8,Math.abs(yL-yH))}" fill="${fvg.type==='BULL'?'rgba(61,220,132,.3)':'rgba(255,77,77,.3)'}" stroke="#ffcc00"/><line x1="0" y1="${toY(fvg.mid)}" x2="200" y2="${toY(fvg.mid)}" stroke="#ffcc00" stroke-dasharray="4 2"/><line x1="0" y1="${toY(st.tp)}" x2="200" y2="${toY(st.tp)}" stroke="#3ddc84" stroke-width="1.5"/><line x1="0" y1="${toY(st.sl)}" x2="200" y2="${toY(st.sl)}" stroke="#ff4d4d"/>`;}svg.innerHTML=h;if(fvg){const b=$(`badge-${sym}`);if(b){b.textContent=`FVG ${fvg.type}`;$(`banner-${sym}`).textContent=`${fvg.type} ${fvg.mid.toFixed(2)} → TP ${st.tp.toFixed(2)}`;$(`entry-${sym}`).textContent=`E ${fvg.mid.toFixed(1)}`;$(`tp-${sym}`).textContent=`TP ${st.tp.toFixed(1)}`;$(`btn-${sym}`).textContent=`⚡ ${st.short} ${fvg.type}`;$(`card-${sym}`).className='card setup';}if(auto&&st.lastPrice){const dist=Math.abs(st.lastPrice-fvg.mid)/fvg.mid;if(dist<0.002&&Date.now()-st.lastTrade>300000){manualTrade(sym);st.lastTrade=Date.now();}}}}
function updateAll(){getVisible().forEach(s=>update(s.symbol));$('countLine').textContent=`${ALL_SYMBOLS.filter(s=>S[s.symbol].fvg).length} FVG / ${getVisible().length} [${filter}] ${currentAccType}`;}
setInterval(updateAll,800);
async function doTest(){const pat=$('apiTokenInput').value.trim();if(!pat.startsWith('pat_')){log('Paste pat_ token','red');return;}savePat();$('btnTest').textContent='TESTING...';try{const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{Authorization:`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=JSON.parse(await r.text());const data=j?.data||[];if(!data.length){log('No accounts','red');return;}data.sort((a,b)=>parseFloat(b.balance)-parseFloat(a.balance));const sel=$('accountSelect');sel.innerHTML='';data.forEach(a=>{const o=document.createElement('option');o.value=a.account_id||a.id;o.textContent=`${a.account_id} $${a.balance} [${a.account_type}]`;sel.appendChild(o);});sel.selectedIndex=0;onAccChange();log(`TEST OK ${data.length} — now pick CR for V10/V25 or DOT for FOREX then CONNECT`,'gold');}catch(e){log('TEST fail '+e.message,'red');}finally{$('btnTest').textContent='1) TEST';}}
function onAccChange(){const sel=$('accountSelect');const acc=sel.value||'';currentAccType=acc;const badge=$('modeBadge'),hint=$('modeHint');if(acc.startsWith('CR')||acc.startsWith('VR')){badge.textContent=`MODE: ${acc.slice(0,2)} — SYNTHETIC • V10/V25/BOOM/CRASH`;badge.className='mode mode-cr';hint.textContent=`CR selected → will load VOL + CRASH/BOOM (32 symbols). You can still tap FOREX to trade GOLD/BTC.`;setFilter('auto');}else if(acc.startsWith('DOT')||acc.startsWith('MF')||acc.startsWith('MT')){badge.textContent=`MODE: ${acc.slice(0,3)} — FINANCIAL • FOREX/GOLD/BTC`;badge.className='mode mode-dot';hint.textContent=`DOT/MF selected → will load FOREX/GOLD/BTC (10 symbols). Create CR account for V10/V25.`;setFilter('auto');}else{badge.textContent=`MODE: ${acc} — ALL`;badge.className='mode mode-cr';}}
document.getElementById('accountSelect').addEventListener('change',onAccChange);
async function getOtp(pat,acc){const url=`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(acc)}/otp`;const r=await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const txt=await r.text();const j=JSON.parse(txt);if(!r.ok) throw new Error(txt.slice(0,200));return j?.data?.url||j?.url;}
async function doConnect(){const pat=$('apiTokenInput').value.trim(),acc=$('accountSelect').value;if(!pat||!acc){log('TEST first','red');return;}savePat();onAccChange();ALL_SYMBOLS.forEach(s=>{S[s.symbol].h1=[];S[s.symbol].m15=[];});build();$('btnConn').textContent='CONNECTING...';$('btnConn').disabled=true;setLive('Fetching OTP...',10);let otp;try{otp=await getOtp(pat,acc);}catch(e){log('OTP fail '+e.message,'red');$('btnConn').disabled=false;$('btnConn').textContent='2) CONNECT';return;}ws=new WebSocket(otp);const vis=getVisible();const q=[...vis.flatMap(s=>[{ticks_history:s.symbol,count:200,end:"latest",granularity:3600,style:"candles"},{ticks_history:s.symbol,count:200,end:"latest",granularity:900,style:"candles"}])];let qi=0;ws.onopen=()=>{log(`WS OPEN — loading ${q.length} candles for ${vis.length} symbols (${currentAccType})`,'gold');const t=setInterval(()=>{if(qi>=q.length){clearInterval(t);log(`✅ LOADED ${vis.length} symbols — TP lines visible`,'gold');setLive(`LIVE: ${vis.length} symbols READY`,100);$('btnConn').textContent='CONNECTED ✅';setTimeout(()=>{$('btnConn').disabled=false;$('btnConn').textContent='2) CONNECT';},1500);vis.forEach((s,i)=>setTimeout(()=>wsSend({ticks:s.symbol,subscribe:1}),i*120));return;}if(wsSend(q[qi])){qi++;setLive(`Loading ${qi}/${q.length} [${currentAccType}]`,10+(qi/q.length*80));}},250);};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return;}if(d.msg_type==='candles'&&d.candles){const st=S[d.echo_req.ticks_history];if(!st) return;const m=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close}));if(d.echo_req.granularity===3600) st.h1=m;else st.m15=m;}if(d.msg_type==='tick'){const st=S[d.tick.symbol];if(st) st.lastPrice=+d.tick.quote;}};ws.onerror=()=>{log('WS error','red');$('btnConn').disabled=false;};ws.onclose=()=>{$('btnConn').disabled=false;}}
function manualTrade(sym){const st=S[sym];if(!st?.fvg){log('No FVG '+sym,'warn');return;}const dir=st.fvg.type==='BULL'?'MULTUP':'MULTDOWN';const slPct=Math.max(0.8,Math.min(5,Math.abs(st.fvg.mid-st.sl)/st.fvg.mid*100*MULT));if(!wsSend({proposal:1,amount:1,basis:'stake',contract_type:dir,underlying_symbol:sym,currency:'USD',multiplier:MULT,limit_order:{stop_loss:slPct,take_profit:TP_PCT},req_id:reqId++})){log('Not connected','red');return;}log(`TRADE ${sym} ${dir} E${st.fvg.mid.toFixed(2)} TP${st.tp.toFixed(2)} +40% [${currentAccType}]`,'gold');}
function toggleAuto(){auto=!auto;const b=$('autoTradeBtn');if(auto){b.textContent=`AUTO: ON ✅ [${currentAccType}]`;b.style.background='#002a12';b.style.color='#3ddc84';log(`AUTO ON — ${currentAccType} — trading ${getVisible().length} symbols`,'gold');}else{b.textContent='AUTO: OFF';b.style.background='';}}
function clearLogs(){$('execLog').innerHTML='';}
function runBacktest(){if(getVisible().every(s=>S[s.symbol].m15.length<20)){log('CONNECT first','red');return;}let total=0,wins=0,pnl=0;getVisible().forEach(({symbol})=>{const m15=S[symbol].m15;for(let i=50;i<m15.length-30;i++){const before=m15.slice(0,i);const fvg=detectFVG(before.slice(-20));if(!fvg)continue;const tp=fvg.mid*(1+(fvg.type==='BULL'?MOVE_PCT:-MOVE_PCT)),sl=fvg.type==='BULL'?fvg.low-fvg.size*0.9:fvg.high+fvg.size*0.9;let retest=-1;for(let k=i;k<Math.min(i+12,m15.length);k++){if(m15[k].low<=fvg.mid&&m15[k].high>=fvg.mid){retest=k;break;}}if(retest==-1)continue;const fut=m15.slice(retest,retest+25);for(let k=0;k<fut.length;k++){if(fvg.type==='BULL'&&fut[k].high>=tp){wins++;total++;pnl+=0.4;break;}if(fvg.type==='BEAR'&&fut[k].low<=tp){wins++;total++;pnl+=0.4;break;}if(fvg.type==='BULL'&&fut[k].low<=sl||fvg.type==='BEAR'&&fut[k].high>=sl){total++;pnl-=0.32;break;}}}});log(`BACKTEST ${currentAccType} WR ${(wins/total*100).toFixed(1)}% Setups ${total} PnL $${pnl.toFixed(2)}`,'gold');}
</script></body></html>
