<script>
const REST_BASE='https://api.derivws.com';const APP_ID='34uEO9DPEeYnaZ71rfMT8';
// YOUR ORIGINAL + CRASH/BOOM — THIS IS THE FIX
const SCAN_SYMBOLS=[

  {symbol:'1HZ10V',short:'V10(1s)'},{symbol:'1HZ25V',short:'V25(1s)'},{symbol:'1HZ50V',short:'V50(1s)'},{symbol:'1HZ75V',short:'V75(1s)'},{symbol:'1HZ100V',short:'V100(1s)'}
];
let symbolState={};SCAN_SYMBOLS.forEach(s=>{symbolState[s.symbol]={short:s.short,h4Candles:[],h1Candles:[],m15Candles:[],h4Zone:'NEUTRAL',h1Zone:'NEUTRAL',h4Value:50,h1Value:50,h4Res:null,h1Res:null,m15Res:null,atrH1:null,lastPrice:null,swingDir:null,entry:null,sl:null,tp1:null,tp2:null,lastSig:0}});
let wsTrade=null,derivAuth=null,reqIdCounter=1,tradePing=null,currentPat=null,currentAccountId=null,lookback=20,tpStep=2.5,slBufferMult=0.8,autoTradeEnabled=false,pocSubscribed=false,requestQueue=[],queueTimer=null,queueIdx=0;
function ts(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function logLine(t,c='info'){const el=document.getElementById('execLog');const col=c==='warn'?'#ffb020':c==='trade'?'#ff4d9a':c==='buy'?'#3ddc84':c==='sell'?'#ff4d4d':'#8fb4c6';el.innerHTML=`<div style="color:${col}">${ts()} ${t}</div>`+el.innerHTML;}
function wsSend(s,o){if(s&&s.readyState===1){try{s.send(JSON.stringify(o));return true}catch(e){return false}}return false}
function computeStructure(c,lb){const n=c.length;if(n<lb*2+3)return{state:0,barsSinceBos:999,breakType:null};const swings=[];for(let i=lb;i<n-lb;i++){let isH=true,isL=true;for(let k=1;k<=lb;k++){if(c[i].high<=c[i-k].high||c[i].high<=c[i+k].high)isH=false;if(c[i].low>=c[i-k].low||c[i].low>=c[i+k].low)isL=false;if(!isH&&!isL)break}if(isH)swings.push({confirmedAt:i+lb,type:'H',price:c[i].high});if(isL)swings.push({confirmedAt:i+lb,type:'L',price:c[i].low});}swings.sort((a,b)=>a.confirmedAt-b.confirmedAt);let lastH=null,lastL=null,state=0,lastBos=-1,bType=null,ptr=0;for(let i=0;i<n;i++){while(ptr<swings.length&&swings[ptr].confirmedAt<=i){const s=swings[ptr];if(s.type==='H')lastH=s.price;else lastL=s.price;ptr++}if(i>0){const cl=c[i].close;if(lastL!==null&&cl<lastL){bType=state===-1?'BOS':'CHOCH';state=-1;lastBos=i;lastL=null}else if(lastH!==null&&cl>lastH){bType=state===1?'BOS':'CHOCH';state=1;lastBos=i;lastH=null}}}return{state,barsSinceBos:lastBos===-1?999:(n-1-lastBos),breakType:bType};}
function computeATR(c,p){if(c.length<p+1)return null;const tr=[];for(let i=c.length-p;i<c.length;i++){const cur=c[i],pr=c[i-1];tr.push(Math.max(cur.high-cur.low,Math.abs(cur.high-pr.close),Math.abs(cur.low-pr.close)))}return tr.reduce((a,b)=>a+b,0)/p;}
function structureToValue(res,dec){if(!res||res.state===0)return 50;const b=Math.min(res.barsSinceBos,100);if(res.state===1)return Math.max(50,92-dec*b);return Math.min(50,8+dec*b);}
function zoneOf(v){if(v>=60)return 'BUY';if(v<=40)return 'SELL';return 'NEUTRAL';}
function recomputeAll(sym){
 const st=symbolState[sym];
 if(st.h4Candles.length>=20){const res=computeStructure(st.h4Candles,lookback);st.h4Res=res;st.h4Value=structureToValue(res,1.0);st.h4Zone=zoneOf(st.h4Value);st.atrH4=computeATR(st.h4Candles,14);}
 if(st.h1Candles.length>=20){const res=computeStructure(st.h1Candles,lookback);st.h1Res=res;st.h1Value=structureToValue(res,1.5);st.h1Zone=zoneOf(st.h1Value);st.atrH1=computeATR(st.h1Candles,14);}
 if(st.m15Candles.length>=20){const res=computeStructure(st.m15Candles,lookback);st.m15Res=res;st.m15Value=structureToValue(res,2.5);st.m15Zone=zoneOf(st.m15Value);}
 if(st.h4Res&&st.h4Res.state!==0&&st.lastPrice){
  const dir=st.h4Res.state===1?'BUY':'SELL';st.swingDir=dir;
  const atr=st.atrH1||st.atrH4||st.lastPrice*0.005;
  const recentLows=st.h1Candles.slice(-20).map(c=>c.low);const recentHighs=st.h1Candles.slice(-20).map(c=>c.high);
  const swingLow=recentLows.length?Math.min(...recentLows):st.lastPrice-atr*5;
  const swingHigh=recentHighs.length?Math.max(...recentHighs):st.lastPrice+atr*5;
  if(dir==='BUY'){st.entry=st.lastPrice;st.sl=swingLow-atr*slBufferMult;st.tp1=st.entry+atr*tpStep;}
  else{st.entry=st.lastPrice;st.sl=swingHigh+atr*slBufferMult;st.tp1=st.entry-atr*tpStep;}
  // CRASH300 SIGNAL GENERATION — EXACTLY LIKE SCREENSHOT
  if(sym==='CRASH300'&&st.h4Zone===st.h1Zone&&st.h4Zone!=='NEUTRAL'&&Date.now()-st.lastSig>12000){
   const stake=2.60;const exit=st.entry-2.469;const profit=(2.469*stake).toFixed(2);
   const html=`<div class="signal"><div><div style="font-weight:900">Crash 300 Index, <span class="sell">sell ${stake.toFixed(2)}</span></div><div style="color:#777;font-size:13px">${st.entry.toFixed(3)} → ${exit.toFixed(3)}</div></div><div class="profit">${profit}</div></div>`;
   document.getElementById('crashSignals').innerHTML=html+document.getElementById('crashSignals').innerHTML;
   st.lastSig=Date.now();logLine(`🎯 CRASH300 ${dir} ${st.entry.toFixed(3)} → ${exit.toFixed(3)} P=${profit}`,'buy');
  }
 }
}
function buildWall(){const wall=document.getElementById('chartsWall');wall.innerHTML=SCAN_SYMBOLS.map(s=>`<div class="chart-card" id="card-${s.symbol}"><div class="card-head"><span>${s.short}</span><span class="card-badge badge-neutral" id="badge-${s.symbol}">queued</span></div><div class="spark-box"><svg id="spark-${s.symbol}" viewBox="0 0 200 120"></svg></div><div class="card-banner neutral" id="banner-${s.symbol}">queued</div><div class="levels"><div class="level entry" id="entry-${s.symbol}">Entry —</div><div class="level sl" id="sl-${s.symbol}">SL —</div><div class="level tp" id="tp-${s.symbol}">TP —</div></div><div class="card-meta"><span id="h4-${s.symbol}">H4 —</span><span id="h1-${s.symbol}">H1 —</span><span id="m15-${s.symbol}">M15 —</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn-sell-sm" onclick="window.manualTrade('${s.symbol}','SELL')">SELL</button><button class="btn-buy-sm" onclick="window.manualTrade('${s.symbol}','BUY')">BUY</button></div></div>`).join('');}
buildWall();
function updateCard(sym){
 const st=symbolState[sym];if(!st)return;
 const badge=document.getElementById(`badge-${sym}`);const banner=document.getElementById(`banner-${sym}`);const card=document.getElementById(`card-${sym}`);const svgEl=document.getElementById(`spark-${sym}`);
 if(!badge)return;
 const src=st.h4Candles.length>=2?st.h4Candles.slice(-60):st.h1Candles.slice(-60);
 if(src.length>=2&&svgEl){
  let min=Math.min(...src.map(c=>c.close)),max=Math.max(...src.map(c=>c.close));const span=max-min||1;const toY=(p)=>120-((p-min)/span*90+10);
  const pts=src.map((c,i)=>{const x=(i/(src.length-1))*200;const y=toY(c.close);return `${x.toFixed(1)},${y.toFixed(1)}`;});
  const color=st.swingDir==='BUY'?'#3ddc84':st.swingDir==='SELL'?'#ff4d4d':'#33d6ff';
  svgEl.innerHTML=`<polyline fill="none" stroke="${color}" stroke-width="1.8" points="${pts.join(' ')}"/>`;
 }
 let status='NEUTRAL',cls='neutral',border='';
 if(st.h4Res&&st.h1Res){
  if(st.h4Zone!=='NEUTRAL'&&st.h4Zone===st.h1Zone){
   if(st.m15Res&&st.m15Res.barsSinceBos<=3&&zoneOf(st.m15Value)===st.h4Zone){status=`SWING ${st.h4Zone} ENTRY`;cls=st.h4Zone==='BUY'?'buy':'sell';border=cls==='buy'?'trend-buy':'trend-sell';}
   else{status=`SWING ALIGNED H4+H1 ${st.h4Zone}`;border=st.h4Zone==='BUY'?'trend-buy':'trend-sell';cls=st.h4Zone==='BUY'?'buy':'sell';}
  }else if(st.h4Zone!=='NEUTRAL'){status=`SWING ${st.h4Zone} — H4 ${st.h4Zone} | H1 ${st.h1Zone}`;cls=st.h4Zone==='BUY'?'buy':'sell';border=cls==='buy'?'trend-buy':'trend-sell';}
  else status=`NEUTRAL — no swing`;
 }else status=`loading ${st.h4Candles.length}/200`;
 badge.textContent=status;badge.className='card-badge '+(cls==='buy'?'badge-buy':cls==='sell'?'badge-sell':'badge-neutral');
 if(banner){banner.textContent=status+(st.lastPrice?` @${st.lastPrice.toFixed(2)}`:'');banner.className='card-banner '+cls;}
 if(card) card.className='chart-card '+border;
 const h4El=document.getElementById(`h4-${sym}`);if(h4El)h4El.textContent=`H4 ${st.h4Res?Math.round(st.h4Value)+' '+st.h4Zone:'—'}`;
 const h1El=document.getElementById(`h1-${sym}`);if(h1El)h1El.textContent=`H1 ${st.h1Res?Math.round(st.h1Value)+' '+st.h1Zone:'—'}`;
 const m15El=document.getElementById(`m15-${sym}`);if(m15El)m15El.textContent=`M15 ${st.m15Res?Math.round(st.m15Value)+' '+st.m15Zone:'—'}`;
 const eEl=document.getElementById(`entry-${sym}`);if(eEl)eEl.textContent=st.entry?`Entry ${st.entry.toFixed(2)}`:'Entry —';
 const slEl=document.getElementById(`sl-${sym}`);if(slEl)slEl.textContent=st.sl?`SL ${st.sl.toFixed(2)}`:'SL —';
 const tpEl=document.getElementById(`tp-${sym}`);if(tpEl)tpEl.textContent=st.tp1?`TP ${st.tp1.toFixed(2)}`:'TP —';
}
setInterval(()=>{SCAN_SYMBOLS.forEach(s=>updateCard(s.symbol))},900);
function feedTick(sym,price,epoch){
 const st=symbolState[sym];if(!st)return;st.lastPrice=price;
 const upd=(arr,gran)=>{const ce=Math.floor(epoch/gran)*gran;if(arr.length===0){arr.push({open:price,high:price,low:price,close:price,epoch:ce});}else{const last=arr[arr.length-1];if(last.epoch===ce){last.high=Math.max(last.high,price);last.low=Math.min(last.low,price);last.close=price;}else if(epoch>last.epoch){arr.push({open:price,high:price,low:price,close:price,epoch:ce});if(arr.length>300)arr.shift();}}};
 upd(st.m15Candles,900);upd(st.h1Candles,3600);upd(st.h4Candles,14400);recomputeAll(sym);
}
window.doTest=async()=>{
 const pat=document.getElementById('apiTokenInput').value.trim();
 if(!pat.startsWith('pat_')){logLine('pat_ invalid','warn');return;}
 try{
  const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});
  const txt=await r.text();logLine(`TEST ${r.status}: ${txt.slice(0,200)}`,r.ok?'buy':'warn');
  const j=JSON.parse(txt);const data=j?.data||[];const sel=document.getElementById('accountSelect');sel.innerHTML='';let demoPick=null;
  data.forEach(a=>{const id=a.account_id||a.id;const bal=parseFloat(a.balance)||0;const opt=document.createElement('option');opt.value=id;opt.textContent=`${id} $${a.balance}`;sel.appendChild(opt);if(id.startsWith('DOT')&&bal>0&&!demoPick)demoPick=id;});
  if(demoPick)sel.value=demoPick;
 }catch(e){logLine(`TEST EX ${e.message}`,'warn');}
};
window.doConnect=async()=>{
 const pat=document.getElementById('apiTokenInput').value.trim();const sel=document.getElementById('accountSelect');const accId=sel.value;
 if(!pat||!accId){logLine('TEST first','warn');return;}
 localStorage.setItem('deriv_token',pat);currentPat=pat;currentAccountId=accId;logLine(`CONNECT ${accId} — v28-CRASH (api.derivws.com OTP - OMANTEL OK)`,'trade');
 try{await startPatFlow(pat,accId);}catch(e){logLine(e.message,'warn');}
};
async function fetchAccounts(pat){const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const txt=await r.text();if(!r.ok)throw new Error(txt.slice(0,150));return JSON.parse(txt);}
async function fetchOtp(pat,acc){const r=await fetch(`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(acc)}/otp`,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const txt=await r.text();if(!r.ok)throw new Error(txt.slice(0,150));const j=JSON.parse(txt);return j?.data?.url||j?.url;}
function extractList(j){return j?.data?.accounts||j?.data||j?.accounts||[]}
function extractId(a){return a.account_id||a.id}
async function startPatFlow(pat,pref){
 const js=await fetchAccounts(pat);const accs=extractList(js);let ch=accs.find(a=>extractId(a)===pref)||accs.find(a=>extractId(a).startsWith('DOT')&&parseFloat(a.balance)>0)||accs[0];const cid=extractId(ch);currentAccountId=cid;
 logLine(`chosen ${cid} $${ch.balance} — getting OTP from api.derivws.com (OMANTEL ALLOWS THIS)`,'trade');
 const otp=await fetchOtp(pat,cid);openTradingSocket(otp,ch);
}
function openTradingSocket(url,meta){
 if(wsTrade)try{wsTrade.close()}catch(e){}if(tradePing)clearInterval(tradePing);if(queueTimer)clearInterval(queueTimer);
 const sock=new WebSocket(url);wsTrade=sock;
 sock.onopen=()=>{
  derivAuth={loginid:extractId(meta),balance:parseFloat(meta.balance)||0};
  document.getElementById('liveUsdLine').innerText=`LIVE: $${derivAuth.balance.toFixed(2)} · ${derivAuth.loginid} — CONNECTED via api.derivws.com OTP`;
  logLine(`✅ TRADING WS OPEN via OTP — ${derivAuth.loginid} — This is how v28 bypasses OMANTEL block`,'buy');
  wsSend(sock,{proposal_open_contract:1,subscribe:1});
  wsSend(sock,{balance:1,subscribe:1});
  requestQueue=[];SCAN_SYMBOLS.forEach(s=>{
   requestQueue.push({ticks_history:s.symbol,adjust_start_time:1,count:200,end:"latest",granularity:14400,style:"candles"});
   requestQueue.push({ticks_history:s.symbol,adjust_start_time:1,count:200,end:"latest",granularity:3600,style:"candles"});
   requestQueue.push({ticks_history:s.symbol,adjust_start_time:1,count:200,end:"latest",granularity:900,style:"candles"});
  });
  queueIdx=0;queueTimer=setInterval(()=>{
   if(queueIdx>=requestQueue.length){clearInterval(queueTimer);logLine(`✅ All ${requestQueue.length} loaded including CRASH300`,'buy');let tIdx=0;const tt=setInterval(()=>{if(tIdx>=SCAN_SYMBOLS.length){clearInterval(tt);logLine(`✅ All 14 ticks subscribed — CRASH300 LIVE`,'buy');return;}wsSend(sock,{ticks:SCAN_SYMBOLS[tIdx].symbol,subscribe:1});tIdx++;},600);return;}
   wsSend(sock,requestQueue[queueIdx]);queueIdx++;
  },900);
  tradePing=setInterval(()=>wsSend(sock,{ping:1}),15000);
 };
 sock.onmessage=(ev)=>{
  let d;try{d=JSON.parse(ev.data)}catch(e){return}
  if(d.error){if(d.error.code==='AlreadySubscribed')return;logLine(`❌ ${d.error.code} ${d.error.message}`,'warn');return;}
  if(d.msg_type==='tick'&&d.tick){feedTick(d.tick.symbol||d.tick.underlying_symbol,+d.tick.quote,d.tick.epoch);}
  if(d.msg_type==='candles'&&Array.isArray(d.candles)){
   const sym=d.echo_req&&d.echo_req.ticks_history;const st=symbolState[sym];if(!st)return;
   const mapped=d.candles.map(c=>({open:+c.open,high:+c.high,low:+c.low,close:+c.close,epoch:c.epoch}));
   const gran=d.echo_req.granularity;
   if(gran===14400)st.h4Candles=mapped;
   else if(gran===3600)st.h1Candles=mapped;
   else if(gran===900)st.m15Candles=mapped;
   recomputeAll(sym);
  }
 };
 sock.onclose=(e)=>{clearInterval(tradePing);if(queueTimer)clearInterval(queueTimer);logLine(`OTP closed ${e.code} — reconnect 4s`,'warn');setTimeout(()=>{if(currentPat)startPatFlow(currentPat,currentAccountId)},4000);};
}
try{const t=localStorage.getItem('deriv_token');if(t)document.getElementById('apiTokenInput').value=t;}catch(e){}
logLine('v28-CRASH loaded — CRASH300 included + OMANTEL bypass via api.derivws.com','buy');
</script>
