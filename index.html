<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>v32 FIX OPTIONS vs MULTIPLIERS</title>
<style>body{margin:0;background:#03070c;color:#dff6ff;font-family:monospace}.topbar{background:#071018;border:1px solid #123041;border-radius:10px;padding:10px;margin:8px}input,select,button{width:100%;background:#07141f;color:#33d6ff;border:1px solid #1a7a99;border-radius:8px;padding:11px}button{font-weight:800;min-height:42px}.log{font-size:9px;white-space:pre-wrap;max-height:320px;overflow:auto;background:#040b12;border:1px solid #123041;border-radius:8px;padding:8px;margin-top:8px}.card{background:#071018;border:1px solid #123041;border-radius:10px;padding:8px;margin:8px}</style></head><body>
<div class="topbar"><b style="color:#3ddc84">SNIPER v32 — OPTIONS vs MULTIPLIERS FIX</b><div id="liveUsdLine" style="font-size:11px;color:#ffb020">LIVE: not connected</div><input type="text" id="apiTokenInput" placeholder="pat_..."><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><select id="accountSelect"></select><button onclick="window.doTest()">1) TEST</button></div><button onclick="window.doConnect()" style="background:#082d18;border:2px solid #3ddc84;color:#3ddc84;margin-top:8px">2) CONNECT v32</button><div class="log" id="execLog">v32 loaded</div><div id="list"></div></div>
<script>
const REST_BASE='https://api.derivws.com';const APP_ID='34uEO9DPEeYnaZ71rfMT8';
function ts(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}function logLine(t,c='info'){const el=document.getElementById('execLog');const col=c==='warn'?'#ffb020':c==='buy'?'#3ddc84':'#ff4d9a';el.innerHTML=`<div style="color:${col}">${ts()} ${t}</div>`+el.innerHTML;}
function wsSend(s,o){if(s&&s.readyState===1){try{s.send(JSON.stringify(o));return true}catch(e){return false}}return false}
window.doTest=async()=>{const pat=document.getElementById('apiTokenInput').value.trim();try{const r=await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}});const j=await r.json();const data=j?.data||[];const sel=document.getElementById('accountSelect');sel.innerHTML='';data.forEach(a=>{const id=a.account_id||a.id;const opt=document.createElement('option');opt.value=id;opt.textContent=`${id} $${a.balance} ${(a.account_type||'').toUpperCase()}`;sel.appendChild(opt);});logLine(`Found ${data.length} accounts - Look for MULTIPLIERS not OPTIONS`,'buy');}catch(e){logLine(e.message,'warn');}};
window.doConnect=async()=>{const pat=document.getElementById('apiTokenInput').value.trim();const sel=document.getElementById('accountSelect');const accId=sel.value;localStorage.setItem('deriv_token',pat);const js=await (await fetch(`${REST_BASE}/trading/v1/options/accounts`,{headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}})).json();const accs=js?.data||[];let ch=accs.find(a=>(a.account_id||a.id)===accId)||accs[0];const otp=await (await fetch(`${REST_BASE}/trading/v1/options/accounts/${encodeURIComponent(ch.account_id||ch.id)}/otp`,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID}})).json();openSocket(otp?.data?.url||otp?.url,ch,pat);};
function openSocket(url,meta,pat){const sock=new WebSocket(url);sock.onopen=()=>{document.getElementById('liveUsdLine').innerText=`LIVE: ${meta.account_id||meta.id} ${meta.account_type} — requesting active_symbols for ALL types`;logLine(`WS OPEN ${meta.account_id} type=${meta.account_type} — this account type does NOT have CRASH300`,'warn');logLine(`Requesting active_symbols basic AND multiplier...`,'buy');wsSend(sock,{active_symbols:'brief'});setTimeout(()=>wsSend(sock,{active_symbols:'brief',product_type:'basic'}),600);setTimeout(()=>wsSend(sock,{active_symbols:'brief',product_type:'multiplier'}),1200);setTimeout(()=>wsSend(sock,{active_symbols:'brief',product_type:'cfds'}),1800);};let seen=0;sock.onmessage=(ev)=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}if(d.msg_type==='active_symbols'){seen++;const list=d.active_symbols||[];logLine(`active_symbols #${seen} (${d.echo_req?.product_type||'ALL'}): ${list.length} symbols`,'buy');const crash=list.filter(a=>/CRASH|BOOM|STEP|JUMP|RANGE|stpRNG|JD|RB/i.test(a.symbol));crash.forEach(a=>{logLine(` FOUND: ${a.symbol} - ${a.display_name||a.display_symbol} [${a.market_display_name}]`,'buy');});if(crash.length===0){logLine(`⚠️ 0 Crash/Boom/Step/Jump/Range in this product_type=${d.echo_req?.product_type||'ALL'} — account type ${meta.account_type} doesn't have them`,'warn');if(seen===1){document.getElementById('list').innerHTML=`<div class="card" style="border-color:#ff4d4d"><b style="color:#ff4d4d">YOUR ACCOUNT ${meta.account_id||meta.id} IS ${ (meta.account_type||'').toUpperCase()} — IT WILL NEVER HAVE CRASH300</b><br><br>Fix:<br>1. Go to Deriv.com → Demo → Create Multipliers account<br>2. Use that account_id in v32<br>3. Or use this API to create one:<br><br><button onclick="window.createMultiplier()">CLICK TO CREATE MULTIPLIERS DEMO VIA API</button><div id="createLog" style="font-size:10px;margin-top:8px;color:#ffb020"></div></div>`;}}else{document.getElementById('list').innerHTML+=`<div class="card"><b>${d.echo_req?.product_type||'ALL'} has ${crash.length} special symbols</b><br>${crash.map(c=>c.symbol).join(', ')}</div>`;}}if(d.error){logLine(`❌ ${d.error.code} ${d.error.message}`,'warn');}};window.createMultiplier=async()=>{const pat=document.getElementById('apiTokenInput').value.trim();const log=document.getElementById('createLog');log.innerHTML='Creating multiplier demo...';try{const r=await fetch(`${REST_BASE}/trading/v1/accounts`,{method:'POST',headers:{'Authorization':`Bearer ${pat}`,'Deriv-App-ID':APP_ID,'Content-Type':'application/json'},body:JSON.stringify({account_type:'multiplier',currency:'USD',is_demo:true})});const txt=await r.text();log.innerHTML=`Create response ${r.status}: ${txt.slice(0,500)}<br><br>Now TEST again - you will see new MULTIPLIER account`;}catch(e){log.innerHTML=`Error ${e.message}`;}};sock.onclose=()=>{logLine('closed','warn');};}try{const t=localStorage.getItem('deriv_token');if(t)document.getElementById('apiTokenInput').value=t;}catch(e){}
</script></body></html>
